  <text x="26" y="210" font-family="Nunito Sans,system-ui,sans-serif" font-size="12" fill="#6b6b80">• Peak temp 38.1°C (ear, Tuesday 2pm)</text>
  <text x="26" y="228" font-family="Nunito Sans,system-ui,sans-serif" font-size="12" fill="#6b6b80">• Last feed: 5oz at 8am (below normal)</text>
  <text x="26" y="246" font-family="Nunito Sans,system-ui,sans-serif" font-size="12" fill="#6b6b80">• Weight: 5.2 kg — last checked 2 weeks ago</text>
  <text x="26" y="264" font-family="Nunito Sans,system-ui,sans-serif" font-size="12" fill="#6b6b80">• No medicines since Thursday Calpol</text>
  <text x="26" y="282" font-family="Nunito Sans,system-ui,sans-serif" font-size="12" fill="#6b6b80">• Sleep pattern changed — waking every 90 min</text>
  <text x="26" y="300" font-family="Nunito Sans,system-ui,sans-serif" font-size="12" fill="#6b6b80">• Right ear pulling since yesterday</text>
  <text x="26" y="318" font-family="Nunito Sans,system-ui,sans-serif" font-size="12" fill="#6b6b80">• Check red book is up to date</text>
  <text x="26" y="336" font-family="Nunito Sans,system-ui,sans-serif" font-size="12" fill="#6b6b80">• Ask about referral to paediatric eczema clinic</text>

