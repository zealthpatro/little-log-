<svg viewBox="0 0 320 500" xmlns="http://www.w3.org/2000/svg">
  <!-- Outer card -->
  <rect x="4" y="4" width="312" height="492" rx="22" fill="#ffffff" stroke="#e8e8f0" stroke-width="1.5"/>
  <!-- Header bar -->
  <rect x="4" y="4" width="312" height="56" rx="22" fill="#fdf0f5"/>
  <rect x="4" y="36" width="312" height="24" fill="#fdf0f5"/>
  <text x="160" y="37" text-anchor="middle" font-family="Georgia,serif" font-size="17" font-weight="600" fill="#1a1a2e">Privacy</text>
  <!-- Header divider -->
  <line x1="4" y1="60" x2="316" y2="60" stroke="#f0c0d8" stroke-width="1"/>

  <!-- Subtitle -->
  <text x="160" y="78" text-anchor="middle" font-family="Nunito Sans,system-ui,sans-serif" font-size="13" fill="#6b6b80">How your data is protected</text>

  <!-- Layer 1: No trackers (y=84) -->
  <rect x="12" y="84" width="296" height="80" rx="14" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <circle cx="42" cy="124" r="22" fill="#dcfce7"/>
  <text x="42" y="130" text-anchor="middle" font-size="20">🌐</text>
  <text x="72" y="116" font-family="Nunito Sans,system-ui,sans-serif" font-size="14" font-weight="700" fill="#1a1a2e">No ads or trackers</text>
  <text x="72" y="134" font-family="Nunito Sans,system-ui,sans-serif" font-size="11" fill="#6b6b80">No Google Analytics, no Meta pixel,</text>
  <text x="72" y="149" font-family="Nunito Sans,system-ui,sans-serif" font-size="11" fill="#6b6b80">no third-party data sharing.</text>
  <circle cx="294" cy="124" r="11" fill="#dcfce7"/>
  <text x="294" y="128" text-anchor="middle" font-family="Nunito Sans,system-ui,sans-serif" font-size="12" font-weight="800" fill="#22c55e">✓</text>

  <!-- Layer 2: Your circle only (y=174) -->
  <rect x="12" y="174" width="296" height="80" rx="14" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <circle cx="42" cy="214" r="22" fill="#dcfce7"/>
  <text x="42" y="220" text-anchor="middle" font-size="20">🏠</text>
  <text x="72" y="206" font-family="Nunito Sans,system-ui,sans-serif" font-size="14" font-weight="700" fill="#1a1a2e">Your circle only</text>
  <text x="72" y="224" font-family="Nunito Sans,system-ui,sans-serif" font-size="11" fill="#6b6b80">Only people you invite can see</text>
  <text x="72" y="239" font-family="Nunito Sans,system-ui,sans-serif" font-size="11" fill="#6b6b80">your baby's log.</text>
  <circle cx="294" cy="214" r="11" fill="#dcfce7"/>
  <text x="294" y="218" text-anchor="middle" font-family="Nunito Sans,system-ui,sans-serif" font-size="12" font-weight="800" fill="#22c55e">✓</text>

  <!-- Layer 3: Shared care log (y=264) -->
  <rect x="12" y="264" width="296" height="80" rx="14" fill="#fdf0f5" stroke="#f0c0d8" stroke-width="1"/>
  <circle cx="42" cy="304" r="22" fill="#fde8f1"/>
  <text x="42" y="310" text-anchor="middle" font-size="20">📋</text>
  <text x="72" y="296" font-family="Nunito Sans,system-ui,sans-serif" font-size="14" font-weight="700" fill="#1a1a2e">Shared care log</text>
  <text x="72" y="314" font-family="Nunito Sans,system-ui,sans-serif" font-size="11" fill="#6b6b80">Everyone in your circle can read</text>
  <text x="72" y="329" font-family="Nunito Sans,system-ui,sans-serif" font-size="11" fill="#6b6b80">and add entries to the shared log.</text>
  <circle cx="294" cy="304" r="11" fill="#dcfce7"/>
  <text x="294" y="308" text-anchor="middle" font-family="Nunito Sans,system-ui,sans-serif" font-size="12" font-weight="800" fill="#22c55e">✓</text>

  <!-- Layer 4: Health & mood — you only (y=354) -->
  <rect x="12" y="354" width="296" height="80" rx="14" fill="#fdf0f5" stroke="#f0c0d8" stroke-width="1"/>
  <circle cx="42" cy="394" r="22" fill="#fde8f1"/>
  <text x="42" y="400" text-anchor="middle" font-size="20">🔒</text>
  <text x="72" y="386" font-family="Nunito Sans,system-ui,sans-serif" font-size="14" font-weight="700" fill="#c97fa0">Health &amp; mood · You only</text>
  <text x="72" y="404" font-family="Nunito Sans,system-ui,sans-serif" font-size="11" fill="#6b6b80">Personal health entries and mood</text>
  <text x="72" y="419" font-family="Nunito Sans,system-ui,sans-serif" font-size="11" fill="#6b6b80">are only visible to you.</text>
  <circle cx="294" cy="394" r="11" fill="#fdf0f5" stroke="#f0c0d8" stroke-width="1"/>
  <text x="294" y="399" text-anchor="middle" font-size="12">🔒</text>

  <!-- Bottom note -->
  <text x="160" y="458" text-anchor="middle" font-family="Nunito Sans,system-ui,sans-serif" font-size="12" fill="#9a9aac">Your data is never sold or used for ads.</text>
</svg>
