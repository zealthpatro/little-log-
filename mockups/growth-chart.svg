<svg viewBox="0 0 320 500" xmlns="http://www.w3.org/2000/svg">
  <!-- Outer card -->
  <rect x="4" y="4" width="312" height="492" rx="22" fill="#ffffff" stroke="#e8e8f0" stroke-width="1.5"/>
  <!-- Header bar bg -->
  <rect x="4" y="4" width="312" height="56" rx="22" fill="#fdf0f5"/>
  <rect x="4" y="36" width="312" height="24" fill="#fdf0f5"/>
  <!-- Header divider -->
  <line x1="4" y1="60" x2="316" y2="60" stroke="#f0c0d8" stroke-width="1"/>

  <!-- Header title -->
  <text x="20" y="38" font-family="Georgia,serif" font-size="17" font-weight="700" fill="#1a1a2e">Growth</text>

  <!-- Chart subtitle -->
  <text x="16" y="76" font-family="Nunito Sans,system-ui,sans-serif" font-size="12" fill="#9a9aac">Weight · Last 8 weeks</text>

  <!-- Latest stat pill -->
  <rect x="210" y="64" width="98" height="26" rx="13" fill="#fdf0f5" stroke="#f0c0d8" stroke-width="1"/>
  <text x="259" y="81" text-anchor="middle" font-family="Nunito Sans,system-ui,sans-serif" font-size="12" font-weight="700" fill="#c97fa0">5.2 kg · now</text>

  <!-- Chart background -->
  <rect x="44" y="86" width="266" height="302" rx="4" fill="#f5f5fa"/>

  <!-- Grid lines -->
  <line x1="44" y1="90" x2="310" y2="90" stroke="#e8e8f0" stroke-width="0.5"/>
  <line x1="44" y1="155" x2="310" y2="155" stroke="#e8e8f0" stroke-width="0.5"/>
  <line x1="44" y1="220" x2="310" y2="220" stroke="#e8e8f0" stroke-width="0.5"/>
  <line x1="44" y1="285" x2="310" y2="285" stroke="#e8e8f0" stroke-width="0.5"/>

  <!-- Y-axis labels -->
  <text x="36" y="94" text-anchor="end" font-family="Nunito Sans,system-ui,sans-serif" font-size="11" fill="#9a9aac">6 kg</text>
  <text x="36" y="159" text-anchor="end" font-family="Nunito Sans,system-ui,sans-serif" font-size="11" fill="#9a9aac">5 kg</text>
  <text x="36" y="224" text-anchor="end" font-family="Nunito Sans,system-ui,sans-serif" font-size="11" fill="#9a9aac">4 kg</text>
  <text x="36" y="289" text-anchor="end" font-family="Nunito Sans,system-ui,sans-serif" font-size="11" fill="#9a9aac">3 kg</text>

  <!-- WHO reference band -->
  <polygon points="60,280 96,258 132,234 168,210 204,188 240,172 276,158 300,148 300,120 276,130 240,145 204,162 168,180 132,200 96,220 60,248" fill="#c97fa020"/>

  <!-- Baby's weight line -->
  <polyline points="60,272 96,253 132,227 168,201 204,181 240,162 276,149 300,143" fill="none" stroke="#c97fa0" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Data point circles -->
  <circle cx="60" cy="272" r="4" fill="#ffffff" stroke="#c97fa0" stroke-width="2"/>
  <circle cx="96" cy="253" r="4" fill="#ffffff" stroke="#c97fa0" stroke-width="2"/>
  <circle cx="132" cy="227" r="4" fill="#ffffff" stroke="#c97fa0" stroke-width="2"/>
  <circle cx="168" cy="201" r="4" fill="#ffffff" stroke="#c97fa0" stroke-width="2"/>
  <circle cx="204" cy="181" r="4" fill="#ffffff" stroke="#c97fa0" stroke-width="2"/>
  <circle cx="240" cy="162" r="4" fill="#ffffff" stroke="#c97fa0" stroke-width="2"/>
  <circle cx="276" cy="149" r="4" fill="#ffffff" stroke="#c97fa0" stroke-width="2"/>
  <!-- Latest point (solid) -->
  <circle cx="300" cy="143" r="6" fill="#c97fa0"/>

  <!-- X-axis week labels -->
  <text x="60" y="402" text-anchor="middle" font-family="Nunito Sans,system-ui,sans-serif" font-size="10" fill="#9a9aac">Wk 1</text>
  <text x="96" y="402" text-anchor="middle" font-family="Nunito Sans,system-ui,sans-serif" font-size="10" fill="#9a9aac">Wk 2</text>
  <text x="132" y="402" text-anchor="middle" font-family="Nunito Sans,system-ui,sans-serif" font-size="10" fill="#9a9aac">Wk 3</text>
  <text x="168" y="402" text-anchor="middle" font-family="Nunito Sans,system-ui,sans-serif" font-size="10" fill="#9a9aac">Wk 4</text>
  <text x="204" y="402" text-anchor="middle" font-family="Nunito Sans,system-ui,sans-serif" font-size="10" fill="#9a9aac">Wk 5</text>
  <text x="240" y="402" text-anchor="middle" font-family="Nunito Sans,system-ui,sans-serif" font-size="10" fill="#9a9aac">Wk 6</text>
  <text x="276" y="402" text-anchor="middle" font-family="Nunito Sans,system-ui,sans-serif" font-size="10" fill="#9a9aac">Wk 7</text>
  <text x="300" y="402" text-anchor="middle" font-family="Nunito Sans,system-ui,sans-serif" font-size="10" fill="#9a9aac">Wk 8</text>

  <!-- Bottom stats bar -->
  <!-- Left stat -->
  <text x="44" y="432" font-family="Georgia,serif" font-size="18" fill="#1a1a2e">5.2 kg</text>
  <text x="44" y="448" font-family="Nunito Sans,system-ui,sans-serif" font-size="11" fill="#9a9aac">Current weight</text>

  <!-- Middle stat -->
  <text x="160" y="432" text-anchor="middle" font-family="Georgia,serif" font-size="18" fill="#22c55e">+2.0 kg</text>
  <text x="160" y="448" text-anchor="middle" font-family="Nunito Sans,system-ui,sans-serif" font-size="11" fill="#9a9aac">Since birth</text>

  <!-- Right stat -->
  <text x="304" y="429" text-anchor="end" font-family="Nunito Sans,system-ui,sans-serif" font-size="14" font-weight="700" fill="#c97fa0">Above avg</text>
  <text x="304" y="448" text-anchor="end" font-family="Nunito Sans,system-ui,sans-serif" font-size="11" fill="#9a9aac">WHO reference</text>
</svg>
