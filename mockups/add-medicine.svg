<svg viewBox="0 0 320 500" xmlns="http://www.w3.org/2000/svg">
  <!-- Outer card frame -->
  <rect x="4" y="4" width="312" height="492" rx="22" fill="#ffffff" stroke="#e8e8f0" stroke-width="1.5"/>

  <!-- Faint background log entries -->
  <rect x="4" y="4" width="312" height="56" rx="22" fill="#fdf0f5"/>
  <rect x="4" y="36" width="312" height="24" fill="#fdf0f5"/>
  <line x1="4" y1="60" x2="316" y2="60" stroke="#f0c0d8" stroke-width="1"/>
  <text x="20" y="38" font-family="Georgia,serif" font-size="17" font-weight="700" fill="#1a1a2e">Log</text>

  <!-- Faint entry placeholders -->
  <rect x="16" y="68" width="288" height="52" rx="12" fill="#eeeeee"/>
  <rect x="16" y="128" width="288" height="52" rx="12" fill="#eeeeee"/>

  <!-- Overlay dim (top half) -->
  <rect x="4" y="4" width="312" height="192" rx="22" fill="#1a1a2e" opacity="0.22"/>

  <!-- Bottom sheet rounded top -->
  <rect x="4" y="180" width="312" height="32" rx="16" fill="#ffffff"/>
  <!-- Bottom sheet body -->
  <rect x="4" y="196" width="312" height="300" fill="#ffffff"/>

  <!-- Drag handle -->
  <rect x="140" y="188" width="40" height="4" rx="2" fill="#d0d0e0"/>

  <!-- Sheet title -->
  <text x="20" y="222" font-family="Georgia,serif" font-size="18" font-weight="700" fill="#1a1a2e">Log medicine</text>

  <!-- Field 1: Medicine -->
  <rect x="12" y="232" width="296" height="52" rx="12" fill="#f5f5fa"/>
  <text x="24" y="247" font-family="Nunito Sans,system-ui,sans-serif" font-size="11" fill="#9a9aac">Medicine</text>
  <text x="24" y="263" font-family="Nunito Sans,system-ui,sans-serif" font-size="13" font-weight="700" fill="#1a1a2e">Calpol (Paracetamol 120mg/5ml)</text>

  <!-- Field 2: Dose -->
  <rect x="12" y="296" width="296" height="52" rx="12" fill="#f5f5fa"/>
  <text x="24" y="311" font-family="Nunito Sans,system-ui,sans-serif" font-size="11" fill="#9a9aac">Dose</text>
  <text x="24" y="327" font-family="Nunito Sans,system-ui,sans-serif" font-size="14" font-weight="700" fill="#1a1a2e">2.5 ml</text>

  <!-- Field 3: Given at -->
  <rect x="12" y="360" width="296" height="52" rx="12" fill="#f5f5fa"/>
  <text x="24" y="375" font-family="Nunito Sans,system-ui,sans-serif" font-size="11" fill="#9a9aac">Given at</text>
  <text x="24" y="391" font-family="Nunito Sans,system-ui,sans-serif" font-size="14" font-weight="700" fill="#1a1a2e">14:35</text>

  <!-- Field 4: Next dose (pink) -->
  <rect x="12" y="424" width="296" height="52" rx="12" fill="#fdf0f5"/>
  <text x="24" y="439" font-family="Nunito Sans,system-ui,sans-serif" font-size="11" fill="#c97fa0">Next dose (4 hours)</text>
  <text x="24" y="455" font-family="Nunito Sans,system-ui,sans-serif" font-size="14" font-weight="700" fill="#c97fa0">Not before 18:35</text>

  <!-- Save button — pushed down to fit within card -->
  <rect x="12" y="458" width="296" height="34" rx="10" fill="#c97fa0"/>
  <text x="160" y="480" text-anchor="middle" font-family="Nunito Sans,system-ui,sans-serif" font-size="14" font-weight="800" fill="#ffffff">Save to log</text>
</svg>
