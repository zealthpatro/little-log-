<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Cubby: Baby Tracker</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#FBF5E9">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cubby">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Nunito+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<!-- Firebase (cloud sync + sharing). Compat SDK keeps it usable from the inline app script. -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-init.js"></script>
<style>
/* ============ THEME ============ */
:root{
  --bg:#F4EEE3;
  --bg-grad-1:#F7F2E8;
  --bg-grad-2:#EFE6D6;
  --surface:#FFFFFF;
  --surface-2:#FBF7EF;
  --ink:#2C2521;
  --ink-soft:#6E635B;
  --ink-faint:#A89C90;
  --line:#E7DECF;
  --shadow:rgba(60,46,34,0.10);
  --shadow-strong:rgba(60,46,34,0.18);

  --feed:#E29A3B;      --feed-soft:#FBEAD0;
  --sleep:#5E6AA8;     --sleep-soft:#E3E4F4;
  --diaper:#56A08E;    --diaper-soft:#DDF0EA;
  --pump:#C97FA0;      --pump-soft:#F7E3EC;
  --note:#9A8C6E;      --note-soft:#EFE9DA;
  --danger:#D2654E;

  --radius:26px;
  --radius-sm:16px;
  --font-display:'Fraunces',Georgia,serif;
  --font-body:'Nunito Sans',-apple-system,sans-serif;
}
[data-theme="night"]{
  --bg:#1A1614;
  --bg-grad-1:#211B18;
  --bg-grad-2:#15110F;
  --surface:#26201C;
  --surface-2:#2E2722;
  --ink:#F0E7DB;
  --ink-soft:#B7A99A;
  --ink-faint:#7C7064;
  --line:#3A312A;
  --shadow:rgba(0,0,0,0.35);
  --shadow-strong:rgba(0,0,0,0.5);

  --feed:#E0A655;      --feed-soft:#3A2E1C;
  --sleep:#8E97D4;     --sleep-soft:#262842;
  --diaper:#6FBBA8;    --diaper-soft:#1E2F2A;
  --pump:#D793B0;      --pump-soft:#342029;
  --note:#B6A985;      --note-soft:#2C281D;
}

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  font-family:var(--font-body);
  background:
    radial-gradient(120% 80% at 50% 0%, var(--bg-grad-1) 0%, var(--bg-grad-2) 60%, var(--bg) 100%);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
  transition:background .4s ease,color .4s ease;
}
#app{
  max-width:480px;margin:0 auto;height:100dvh;
  display:flex;flex-direction:column;position:relative;
  background:transparent;
}

/* ============ TOPBAR ============ */
.topbar{
  display:flex;align-items:center;gap:12px;
  padding:18px 20px 12px;flex-shrink:0;
}
.baby-pill{
  display:flex;align-items:center;gap:10px;flex:1;
  cursor:pointer;border-radius:40px;padding:6px 6px 6px 6px;
  transition:background .2s;
}
.baby-pill:active{background:var(--surface-2);}
.avatar{
  width:42px;height:42px;border-radius:50%;flex-shrink:0;
  display:grid;place-items:center;font-family:var(--font-display);
  font-weight:600;font-size:18px;color:#fff;
  box-shadow:0 4px 10px var(--shadow);
}
.baby-meta h1{
  font-family:var(--font-display);font-weight:600;font-size:19px;
  line-height:1.1;letter-spacing:-.01em;
}
.baby-meta span{font-size:12px;color:var(--ink-soft);font-weight:600;}
.icon-btn{
  width:42px;height:42px;border:none;border-radius:50%;
  background:var(--surface);color:var(--ink-soft);
  display:grid;place-items:center;cursor:pointer;flex-shrink:0;
  box-shadow:0 3px 9px var(--shadow);transition:transform .15s,color .2s;
}
.icon-btn:active{transform:scale(.92);}
.icon-btn svg{width:20px;height:20px;}

/* ============ SCROLL AREA ============ */
.scroll{flex:1;overflow-y:auto;padding:4px 20px 110px;-webkit-overflow-scrolling:touch;}
.scroll::-webkit-scrollbar{width:0;}

/* ============ ACTIVE TIMER BANNER ============ */
.active-banner{
  border-radius:var(--radius);padding:18px 20px;margin:8px 0 18px;
  display:flex;align-items:center;gap:16px;color:#fff;position:relative;overflow:hidden;
  box-shadow:0 12px 26px var(--shadow-strong);
  animation:rise .5s cubic-bezier(.2,.9,.3,1);
}
.active-banner .pulse{
  width:14px;height:14px;border-radius:50%;background:#fff;flex-shrink:0;
  box-shadow:0 0 0 0 rgba(255,255,255,.7);animation:pulse 1.8s infinite;
}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,255,255,.6);}70%{box-shadow:0 0 0 12px rgba(255,255,255,0);}100%{box-shadow:0 0 0 0 rgba(255,255,255,0);}}
.active-banner .info{flex:1;}
.active-banner .info .lbl{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;opacity:.85;}
.active-banner .info .time{font-family:var(--font-display);font-size:30px;font-weight:600;line-height:1;margin-top:3px;font-variant-numeric:tabular-nums;}
.active-banner .info .sub{font-size:12.5px;opacity:.85;margin-top:4px;font-weight:600;}
.stop-btn{
  background:rgba(255,255,255,.95);border:none;border-radius:18px;
  padding:12px 18px;font-family:var(--font-body);font-weight:800;font-size:14px;
  cursor:pointer;color:var(--ink);transition:transform .15s;
}
.stop-btn:active{transform:scale(.93);}

/* ============ SINCE CARDS ============ */
.since-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px;}
.since-card{
  background:var(--surface);border-radius:var(--radius-sm);padding:13px 12px;
  box-shadow:0 4px 12px var(--shadow);position:relative;
}
.since-card .dot{width:9px;height:9px;border-radius:50%;margin-bottom:7px;}
.since-card .k{font-size:10.5px;color:var(--ink-faint);font-weight:700;text-transform:uppercase;letter-spacing:.05em;}
.since-card .v{font-family:var(--font-display);font-size:18px;font-weight:600;margin-top:2px;font-variant-numeric:tabular-nums;}
.since-card .v.empty{color:var(--ink-faint);font-size:15px;}

/* ============ SECTION TITLE ============ */
.sec-title{
  font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;
  color:var(--ink-faint);margin:6px 4px 12px;
}

/* ============ ACTION GRID ============ */
.actions{display:grid;grid-template-columns:1fr 1fr;gap:13px;}
.action{
  border:none;cursor:pointer;border-radius:var(--radius);padding:20px 18px;
  text-align:left;display:flex;flex-direction:column;gap:14px;min-height:108px;
  background:var(--surface);box-shadow:0 5px 14px var(--shadow);
  transition:transform .14s ease;position:relative;overflow:hidden;
  font-family:var(--font-body);color:var(--ink);
}
.action:active{transform:scale(.96);}
.action .ico{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;}
.action .ico svg{width:25px;height:25px;}
.action .label{font-weight:800;font-size:17px;letter-spacing:-.01em;}
.action .hint{font-size:12px;color:var(--ink-soft);font-weight:600;margin-top:-9px;}
.action.wide{grid-column:span 2;flex-direction:row;align-items:center;min-height:auto;padding:16px 20px;gap:16px;}
.action.wide .txt{flex:1;}
.action.wide .hint{margin-top:1px;}

/* ============ TODAY STRIP ============ */
.today-strip{
  background:var(--surface);border-radius:var(--radius);padding:16px 8px;margin-top:18px;
  display:grid;grid-template-columns:repeat(3,1fr);box-shadow:0 5px 14px var(--shadow);
}
.today-strip .cell{text-align:center;position:relative;}
.today-strip .cell:not(:last-child)::after{content:"";position:absolute;right:0;top:15%;height:70%;width:1px;background:var(--line);}
.today-strip .big{font-family:var(--font-display);font-size:24px;font-weight:600;line-height:1;}
.today-strip .cap{font-size:11px;color:var(--ink-soft);font-weight:700;margin-top:5px;}

/* ============ TIMELINE ============ */
.day-group{margin-bottom:22px;}
.day-head{font-family:var(--font-display);font-size:16px;font-weight:600;margin:0 4px 12px;display:flex;justify-content:space-between;align-items:baseline;}
.day-head .day-sum{font-family:var(--font-body);font-size:11.5px;color:var(--ink-faint);font-weight:700;}
.tl-item{
  display:flex;align-items:center;gap:13px;background:var(--surface);
  border-radius:var(--radius-sm);padding:13px 15px;margin-bottom:9px;
  box-shadow:0 3px 9px var(--shadow);cursor:pointer;transition:transform .12s;
}
.tl-item:active{transform:scale(.985);}
.tl-ico{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex-shrink:0;}
.tl-ico svg{width:20px;height:20px;}
.tl-body{flex:1;min-width:0;}
.tl-body .t1{font-weight:800;font-size:15px;}
.tl-body .t2{font-size:12.5px;color:var(--ink-soft);font-weight:600;margin-top:1px;}
.tl-time{text-align:right;flex-shrink:0;}
.tl-time .clock{font-weight:800;font-size:14px;font-variant-numeric:tabular-nums;}
.tl-time .ago{font-size:11px;color:var(--ink-faint);font-weight:600;margin-top:1px;}

/* ============ STATS ============ */
.stat-card{background:var(--surface);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:0 5px 14px var(--shadow);}
.stat-card h3{font-family:var(--font-display);font-size:17px;font-weight:600;margin-bottom:3px;}
.stat-card .csub{font-size:12px;color:var(--ink-soft);font-weight:600;margin-bottom:18px;}
.bars{display:flex;align-items:flex-end;justify-content:space-between;gap:7px;height:130px;}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;height:100%;justify-content:flex-end;}
.bar-track{width:100%;flex:1;display:flex;align-items:flex-end;}
.bar{width:100%;border-radius:8px 8px 4px 4px;min-height:3px;transition:height .5s cubic-bezier(.2,.9,.3,1);}
.bar-val{font-size:11px;font-weight:800;font-variant-numeric:tabular-nums;}
.bar-day{font-size:10.5px;color:var(--ink-faint);font-weight:700;}
.avg-row{display:flex;gap:12px;margin-bottom:16px;}
.avg-box{flex:1;background:var(--surface);border-radius:var(--radius-sm);padding:15px;box-shadow:0 4px 12px var(--shadow);}
.avg-box .n{font-family:var(--font-display);font-size:26px;font-weight:600;line-height:1;}
.avg-box .l{font-size:11.5px;color:var(--ink-soft);font-weight:700;margin-top:5px;}

/* ============ BOTTOM NAV ============ */
.nav{
  position:absolute;bottom:0;left:0;right:0;display:flex;justify-content:space-around;
  padding:10px 16px calc(14px + env(safe-area-inset-bottom));
  background:linear-gradient(to top,var(--bg) 55%,transparent);
}
.nav-inner{display:flex;justify-content:space-around;background:var(--surface);border-radius:24px;padding:8px;flex:1;box-shadow:0 8px 24px var(--shadow-strong);}
.nav-btn{flex:1;border:none;background:none;cursor:pointer;padding:9px 0;border-radius:18px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--ink-faint);font-family:var(--font-body);font-weight:700;font-size:10.5px;transition:color .2s,background .2s;}
.nav-btn svg{width:22px;height:22px;}
.nav-btn.active{color:var(--ink);background:var(--surface-2);}

/* ============ SHEET / MODAL ============ */
.scrim{position:fixed;inset:0;background:rgba(20,14,10,.42);opacity:0;pointer-events:none;transition:opacity .3s;z-index:50;backdrop-filter:blur(2px);}
.scrim.show{opacity:1;pointer-events:auto;}
.sheet{
  position:fixed;left:50%;bottom:0;transform:translate(-50%,100%);
  width:100%;max-width:480px;background:var(--surface);
  border-radius:30px 30px 0 0;padding:10px 22px calc(26px + env(safe-area-inset-bottom));
  z-index:51;transition:transform .36s cubic-bezier(.2,.9,.3,1);max-height:90dvh;overflow-y:auto;
}
.sheet.show{transform:translate(-50%,0);}
.grab{width:42px;height:5px;border-radius:3px;background:var(--line);margin:6px auto 18px;}
.sheet h2{font-family:var(--font-display);font-size:22px;font-weight:600;margin-bottom:4px;}
.sheet .sub{font-size:13px;color:var(--ink-soft);font-weight:600;margin-bottom:20px;}
.opt-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-bottom:14px;}
.opt{
  border:2px solid var(--line);background:var(--surface-2);border-radius:18px;padding:18px 14px;min-height:104px;
  cursor:pointer;text-align:center;font-family:var(--font-body);font-weight:800;font-size:15px;color:var(--ink);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;transition:all .15s;
}
.opt.wide{grid-column:1 / -1;}
.opt:active{transform:scale(.95);}
.opt.sel{border-color:var(--accent);background:var(--accent-soft);}
.opt svg{width:26px;height:26px;}
.opt .osub{font-size:11px;color:var(--ink-soft);font-weight:600;}
.field{margin-bottom:16px;}
.field label{display:block;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-faint);margin-bottom:8px;}
.field input,.field textarea,.field select{
  width:100%;border:2px solid var(--line);background:var(--surface-2);border-radius:14px;
  padding:13px 15px;font-family:var(--font-body);font-size:16px;font-weight:600;color:var(--ink);
}
.field input:focus,.field textarea:focus,.field select:focus{outline:none;border-color:var(--accent,var(--feed));}
.field textarea{resize:none;min-height:74px;}
.stepper{display:flex;align-items:center;gap:0;border:2px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface-2);}
.stepper button{width:54px;height:50px;border:none;background:none;font-size:24px;font-weight:700;color:var(--accent,var(--feed));cursor:pointer;}
.stepper button:active{background:var(--line);}
.stepper input{flex:1;border:none;text-align:center;background:none;font-size:19px;font-weight:800;font-family:var(--font-display);}
.unit-toggle{display:flex;gap:8px;}
.unit-toggle button{flex:1;border:2px solid var(--line);background:var(--surface-2);border-radius:12px;padding:11px;font-weight:800;font-family:var(--font-body);color:var(--ink-soft);cursor:pointer;font-size:14px;}
.unit-toggle button.on{border-color:var(--accent,var(--feed));background:var(--accent-soft,var(--feed-soft));color:var(--ink);}
.btn-primary{
  width:100%;border:none;border-radius:18px;padding:17px;font-family:var(--font-body);
  font-weight:800;font-size:16px;color:#fff;cursor:pointer;background:var(--accent,var(--feed));
  margin-top:6px;transition:transform .15s,opacity .2s;box-shadow:0 8px 18px var(--shadow-strong);
  display:flex;align-items:center;justify-content:center;gap:9px;
}
.btn-primary:active{transform:scale(.97);}
.btn-primary:disabled{opacity:.4;}
.btn-ghost{width:100%;border:none;background:none;padding:14px;font-family:var(--font-body);font-weight:800;font-size:14px;color:var(--ink-soft);cursor:pointer;margin-top:6px;display:flex;align-items:center;justify-content:center;gap:8px;}
.btn-primary svg,.btn-ghost svg,.dose-btn svg{width:18px;height:18px;flex-shrink:0;}
.btn-danger{color:var(--danger);}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}

/* settings */
.set-item{display:flex;align-items:center;gap:14px;background:var(--surface);border-radius:var(--radius-sm);padding:15px;margin-bottom:10px;box-shadow:0 3px 9px var(--shadow);}
.set-item .si-ico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex-shrink:0;}
.set-item .si-ico svg{width:20px;height:20px;}
.set-item .si-body{flex:1;}
.set-item .si-body .a{font-weight:800;font-size:15px;}
.set-item .si-body .b{font-size:12px;color:var(--ink-soft);font-weight:600;}
.seg{display:flex;background:var(--surface-2);border-radius:12px;padding:3px;gap:3px;}
.seg button{border:none;background:none;padding:8px 13px;border-radius:9px;font-weight:800;font-size:12.5px;color:var(--ink-soft);cursor:pointer;font-family:var(--font-body);}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 2px 6px var(--shadow);}
.baby-item{display:flex;align-items:center;gap:13px;background:var(--surface);border-radius:var(--radius-sm);padding:13px 15px;margin-bottom:9px;box-shadow:0 3px 9px var(--shadow);}

/* onboarding */
.onboard{display:flex;flex-direction:column;justify-content:center;align-items:center;height:100%;padding:40px 30px;text-align:center;}
.onboard .logo{font-family:var(--font-display);font-size:40px;font-weight:600;letter-spacing:-.02em;margin-bottom:6px;}
.onboard .tag{color:var(--ink-soft);font-weight:600;margin-bottom:38px;font-size:15px;}
.onboard .field{width:100%;text-align:left;}
.onboard .avatar-pick{display:flex;gap:10px;justify-content:center;margin-bottom:22px;flex-wrap:wrap;}
.avatar-pick .ap{width:40px;height:40px;border-radius:50%;cursor:pointer;border:3px solid transparent;transition:transform .15s;}
.avatar-pick .ap:active{transform:scale(.9);}
.avatar-pick .ap.sel{border-color:var(--ink);}

.empty-state{text-align:center;padding:50px 20px;color:var(--ink-faint);}
.empty-state svg{width:48px;height:48px;margin-bottom:14px;opacity:.5;}
.empty-state p{font-weight:700;font-size:15px;}
.empty-state span{font-size:13px;font-weight:600;}

.fade-in{animation:rise .45s cubic-bezier(.2,.9,.3,1);}
@keyframes rise{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}
.stagger>*{animation:rise .5s cubic-bezier(.2,.9,.3,1) backwards;}
.stagger>*:nth-child(1){animation-delay:.02s;}
.stagger>*:nth-child(2){animation-delay:.06s;}
.stagger>*:nth-child(3){animation-delay:.10s;}
.stagger>*:nth-child(4){animation-delay:.14s;}
.stagger>*:nth-child(5){animation-delay:.18s;}
.stagger>*:nth-child(6){animation-delay:.22s;}

.toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:13px 22px;border-radius:30px;font-weight:800;font-size:14px;z-index:60;opacity:0;transition:all .3s;pointer-events:none;box-shadow:0 8px 24px var(--shadow-strong);}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* ---- extra accents ---- */
:root{--med:#D2654E;--med-soft:#F7E0D9;--star:#D9A21B;--star-soft:#F6ECCB;}
[data-theme="night"]{--med:#E0795F;--med-soft:#3A241D;--star:#E5BD55;--star-soft:#332B16;}

/* ---- medicine ---- */
.med-due{border-radius:var(--radius);padding:16px 18px;margin:8px 0 14px;display:flex;align-items:center;gap:14px;background:var(--med);color:#fff;box-shadow:0 12px 26px var(--shadow-strong);animation:rise .5s cubic-bezier(.2,.9,.3,1);}
.med-due .info{flex:1;}
.med-due .info .lbl{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;opacity:.85;}
.med-due .info .nm{font-family:var(--font-display);font-size:20px;font-weight:600;line-height:1.05;margin-top:2px;}
.med-due .info .sub{font-size:12.5px;opacity:.9;margin-top:3px;font-weight:600;}
.med-due > svg{width:30px;height:30px;flex-shrink:0;}
.med-card{display:flex;align-items:center;gap:13px;background:var(--surface);border-radius:var(--radius-sm);padding:13px 15px;margin-bottom:9px;box-shadow:0 3px 9px var(--shadow);}
.med-card .mc-ico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--med-soft);color:var(--med);flex-shrink:0;}
.med-card .mc-ico svg{width:21px;height:21px;}
.med-card .mc-body{flex:1;min-width:0;cursor:pointer;}
.med-card .mc-body .a{font-weight:800;font-size:15px;}
.med-card .mc-body .b{font-size:12px;color:var(--ink-soft);font-weight:600;margin-top:1px;}
.med-card .mc-body .b.due{color:var(--med);font-weight:800;}
.dose-btn{border:none;background:var(--med-soft);color:var(--med);font-weight:800;font-size:13px;border-radius:13px;padding:11px 14px;cursor:pointer;font-family:var(--font-body);flex-shrink:0;transition:transform .15s;}
.dose-btn:active{transform:scale(.93);}
.add-row{display:flex;align-items:center;justify-content:center;gap:9px;background:var(--surface);border:2px dashed var(--line);border-radius:var(--radius-sm);padding:15px;cursor:pointer;font-weight:800;color:var(--ink-soft);font-size:14px;}

<script>
/* ============================================================
   LITTLE LOG: baby activity tracker
   Persistence: window.storage (claude.ai artifact storage),
   with graceful in-memory fallback.
   ============================================================ */

/* ---------- Storage layer (swap this for Firebase later) ---------- */
const KEY = 'little-log-v1';
let memFallback = null;
const Store = {
  async load(){
    try{
      if(window.storage){
        const r = await window.storage.get(KEY);
        return r && r.value ? JSON.parse(r.value) : null;
      }
      if(typeof localStorage!=='undefined'){
        const v = localStorage.getItem(KEY);
        return v ? JSON.parse(v) : null;
      }
    }catch(e){ return memFallback; }
    return memFallback;
  },
  async save(data){
    memFallback = data;
    try{
      if(window.storage){ await window.storage.set(KEY, JSON.stringify(data)); }
      else if(typeof localStorage!=='undefined'){ localStorage.setItem(KEY, JSON.stringify(data)); }
    }
    catch(e){ /* keep in memory */ }
  }
};

try{ window.CUBBY_VERSION = CUBBY_VERSION; }catch(e){}

const AVATAR_COLORS = ['#E29A3B','#5E6AA8','#56A08E','#C97FA0','#D2654E','#7B9E5B'];

/* ---------- Helpers ---------- */
const $ = s => document.querySelector(s);
const app = () => $('#app');
const now = () => Date.now();
const uid = () => Math.random().toString(36).slice(2,10)+now().toString(36);

function babyEvents(){ return state.events.filter(e=>e.babyId===state.activeBabyId).sort((a,b)=>b.time-a.time); }
function activeBaby(){ return state.babies.find(b=>b.id===state.activeBabyId); }

function fmtClock(ts){
  const d = new Date(ts);
  let h = d.getHours(), m = d.getMinutes();
  const ap = h>=12?'PM':'AM'; h = h%12||12;
  return h+':'+String(m).padStart(2,'0')+' '+ap;
}
function fmtDur(ms){
  const s = Math.floor(ms/1000), h=Math.floor(s/3600), m=Math.floor((s%3600)/60), sec=s%60;
  if(h>0) return h+'h '+m+'m';
  if(m>0) return m+'m';
  return sec+'s';
}
function fmtDurClock(ms){
  const s=Math.floor(ms/1000),h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sec=s%60;
  const pad=n=>String(n).padStart(2,'0');
  return h>0 ? h+':'+pad(m)+':'+pad(sec) : pad(m)+':'+pad(sec);
}
function fmtSince(ts){
  if(!ts) return null;
  const diff = now()-ts, m=Math.floor(diff/60000), h=Math.floor(m/60);
  if(m<1) return 'just now';
  if(m<60) return m+'m ago';
  if(h<24) return h+'h '+(m%60)+'m';
  return Math.floor(h/24)+'d ago';
}
function ageString(birthTs){
  if(!birthTs) return '';
  const diff = now()-birthTs, days = Math.floor(diff/86400000);
  if(days<0) return 'due soon';
  if(days<14) return days+' days old';
  if(days<60) return Math.floor(days/7)+' weeks old';
  if(days<730){ const mo=Math.floor(days/30.44); return mo+' months old'; }
  return Math.floor(days/365)+' years old';
}
function dayKey(ts){ const d=new Date(ts); return d.getFullYear()+'-'+d.getMonth()+'-'+d.getDate(); }
function dayLabel(ts){
  const d=new Date(ts), t=new Date(), y=new Date(t.getTime()-86400000);
  if(dayKey(ts)===dayKey(t.getTime())) return 'Today';
  if(dayKey(ts)===dayKey(y.getTime())) return 'Yesterday';
  return d.toLocaleDateString(undefined,{weekday:'long',month:'short',day:'numeric'});
}
function toast(msg){
  const t=$('#toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(t._tm); t._tm=setTimeout(()=>t.classList.remove('show'),1900);
}
let _loaderTimer=null;
function showLoader(msgs){
  hideLoader();
  msgs=(msgs&&msgs.length)?msgs:['One moment'];
  const o=document.createElement('div'); o.className='loader-ov'; o.id='loaderOv';
  o.innerHTML=`<div class="loader-card"><div class="loader-spin"></div><div class="loader-msg" id="loaderMsg">${escapeHtml(msgs[0])}</div></div>`;
  document.body.appendChild(o);
  if(msgs.length>1){ let i=0; _loaderTimer=setInterval(()=>{ i=(i+1)%msgs.length; const el=document.getElementById('loaderMsg'); if(el)el.textContent=msgs[i]; },1300); }
}
function hideLoader(){ if(_loaderTimer){clearInterval(_loaderTimer);_loaderTimer=null;} const o=document.getElementById('loaderOv'); if(o)o.remove(); }
// let the overlay paint before heavy synchronous canvas work
function paintYield(){ return new Promise(r=>requestAnimationFrame(()=>setTimeout(r,0))); }

/* ---------- Persistence ---------- */
async function persist(){ await Store.save(state); }

/* ---------- Event creation ---------- */
function addEvent(ev){
  ev.id = uid(); ev.babyId = state.activeBabyId;
  state.events.push(ev);
  persist();
}
/* ---- multi-baby logging: single child unaffected; 2+ babies can log for one or all ---- */
let logTargets=null;
function initTargets(){ logTargets=[state.activeBabyId]; }
function targetSetOne(id){ logTargets=[id]; }
function targetSetAll(){ logTargets=state.babies.map(b=>b.id); }
function targetsResolved(){ return (state.babies.length>1 && logTargets && logTargets.length) ? logTargets : [state.activeBabyId]; }
function commitEvent(payload){
  const targets=targetsResolved();
  targets.forEach(bid=>{ const ev=Object.assign({},payload); ev.id=uid(); ev.babyId=bid; state.events.push(ev); });
  persist();
}
function targetChips(reRender){
  if(state.babies.length<2) return '';
  if(!logTargets) initTargets();
  const all = logTargets.length===state.babies.length;
  const chips=state.babies.map(b=>{
    const on = !all && logTargets.length===1 && logTargets[0]===b.id;
    return `<button class="tgt ${on?'on':''}" onclick="targetSetOne('${b.id}');${reRender}()"><span class="td" style="background:${b.color}"></span>${escapeHtml(b.name)}</button>`;
  }).join('');
  return `<div class="field"><label>Log for</label><div class="tgt-row">${chips}<button class="tgt ${all?'on':''}" onclick="targetSetAll();${reRender}()">${state.babies.length>2?'All':'Both'}</button></div></div>`;
}
/* ---- per-baby live timers ---- */
function timersFor(id){ if(!state.timers[id]) state.timers[id]={}; return state.timers[id]; }

/* ---- unified logging time strip (one intuitive "when" control for every flow) ---- */
const CLOCK_SVG='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 1.5"/></svg>';
let logTimes = { when:null, end:null };
function initLogWhen(){ logTimes = { when: now(), end: now() }; }
function getWhen(slot){ slot=slot||'when'; const v=logTimes[slot]; return v==null?now():v; }
function setWhen(slot, ms){ logTimes[slot]=ms; document.querySelectorAll('.ts-label[data-slot="'+slot+'"]').forEach(function(el){ el.textContent=whenLabel(ms); }); }
function whenLabel(ms){ return dayLabel(ms)+' · '+fmtClock(ms); }
function timeStrip(slot,label){ slot=slot||'when'; label=label||'When'; if(logTimes[slot]==null) logTimes[slot]=now();
  return `<div class="time-strip" onclick="openWhenPicker(getWhen('${slot}'), function(m){setWhen('${slot}',m);}, '${label}')">
    <span class="ts-ico">${CLOCK_SVG}</span>
    <span class="ts-text"><span class="ts-cap">${label}</span><span class="ts-label" data-slot="${slot}">${whenLabel(getWhen(slot))}</span></span>
    <span class="ts-edit">Change</span></div>`;
}
window.getWhen=getWhen; window.setWhen=setWhen;

function render(){
  document.body.setAttribute('data-theme', state.settings.theme==='night'?'night':'light');
  if(state.babies.length===0){ renderOnboard(); return; }
  const b = activeBaby();
  let main = '';
  if(view==='home') main = renderHome();
  else if(view==='log') main = renderLogTab();
  else if(view==='album') main = renderAlbum();
  else if(view==='health') main = renderHealth();

  app().innerHTML = `
    <div class="topbar">
      <div class="baby-pill" onclick="openBabySheet()">
        ${babyAvatarBox(b,'avatar')}
        <div class="baby-meta">
          <h1>${escapeHtml(b.name)}</h1>
          <span>${ageString(b.birth)}</span>
        </div>
      </div>
      <button class="icon-btn" onclick="toggleTheme()" aria-label="theme">${state.settings.theme==='night'?I.sun:I.moon}</button>
      <button class="icon-btn" onclick="openSettings()" aria-label="settings">${I.settings}</button>
    </div>
    <div class="scroll" id="scroll">${main}</div>
    <div class="nav"><div class="nav-inner">
      <button class="nav-btn ${view==='home'?'active':''}" onclick="go('home')">${I.home}Home</button>

      <button class="nav-btn ${view==='health'?'active':''}" onclick="go('health')">${I.cross}Health</button>
    </div></div>`;
  startTick();
  if(view==='home') initHero(); else if(heroTimer){ clearInterval(heroTimer); heroTimer=null; }
}

function escapeHtml(s){ return (s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ---------- HOME ---------- */
function lastOf(type){ return babyEvents().find(e=>e.type===type); }
function myName(){
  try{ const u=window.LL&&window.LL.auth&&window.LL.auth.currentUser; const mi=u&&window.LL.memberInfo&&window.LL.memberInfo[u.uid]; return (mi&&(mi.relationship||((mi.name||'').split(' ')[0])))||''; }catch(e){ return ''; }
}
function meGreeting(){
  const name=myName();
  const h=new Date().getHours();
  const part = (h<5||h>=23)?'Still up':(h<12?'Good morning':(h<17?'Good afternoon':'Good evening'));
  return name ? `${part}, ${escapeHtml(name)} 🐻` : `${part} 🐻`;
}
function homeNudgeLine(){
  const b=activeBaby(); if(!b) return '';
  const h=new Date().getHours();
  if(h<5||h>=23) return `The 3am club 🐻, you've got this. Sleep when you can 💛`;
  const evs=babyEvents();
  const recentSleep=evs.filter(e=>e.type==='sleep'&&e.end&&(now()-e.end)<16*3600000);
  const longest=recentSleep.reduce((m,e)=>Math.max(m,e.end-e.time),0);
  if(longest>=3*3600000){ const hrs=longest/3600000; return `${escapeHtml(b.name)} slept ~${hrs>=10?Math.round(hrs):hrs.toFixed(1)}h recently 💤`; }
  const todayK=dayKey(now());
  const feedsToday=evs.filter(e=>e.type==='feed'&&dayKey(e.time)===todayK).length;
  if(feedsToday>0) return `${feedsToday} feed${feedsToday>1?'s':''} logged today 🍼`;
  return `A fresh day with ${escapeHtml(b.name)} 🌿`;
}
function monthiversary(){
  const b=activeBaby(); if(!b||!b.birth) return null;
  const bd=new Date(b.birth), t=new Date();
  if(bd.getDate()!==t.getDate()) return null;
  let m=(t.getFullYear()-bd.getFullYear())*12+(t.getMonth()-bd.getMonth());
  return m>=1 ? m : null;
}

let heroIdx=0, heroTimer=null;
function heroPhotos(){ return (state.photos||[]).filter(p=>p.babyId===state.activeBabyId); }
function renderHero(){
  const ph=heroPhotos();
  if(!ph.length){
    return `<div class="hero-invite" onclick="go('album')">

      <div><div class="ht">Add a photo</div><div class="hs">Saved photos appear here as a slideshow</div></div>
    </div>`;
  }
  const b=activeBaby();
  const slides=ph.map((p,i)=>`<div class="hero-slide ${i===0?'active':''}"><div class="hero-bg" style="background-image:url('${photoSrc(p.photoId)}')"></div><img src="${photoSrc(p.photoId)}"></div>`).join('');
  const dots=ph.length>1?`<div class="hero-dots">${ph.map((p,i)=>`<span class="${i===0?'on':''}"></span>`).join('')}</div>`:'';
  return `<div class="hero" onclick="go('album')">

    <div class="hero-cap"><div class="nm">${escapeHtml(b.name)}</div><div class="ag">${ageString(b.birth)||''}</div></div>
    ${dots}
  </div>`;
}
function initHero(){
  if(heroTimer){ clearInterval(heroTimer); heroTimer=null; }
  const slides=document.querySelectorAll('#scroll .hero-slide');
  if(slides.length<2) return;
  const dots=document.querySelectorAll('#scroll .hero-dots span');
  heroIdx=0;
  heroTimer=setInterval(()=>{
    const cur=document.querySelectorAll('#scroll .hero-slide');
    if(!cur.length){ clearInterval(heroTimer); heroTimer=null; return; }
    cur[heroIdx]&&cur[heroIdx].classList.remove('active');
    dots[heroIdx]&&dots[heroIdx].classList.remove('on');
    heroIdx=(heroIdx+1)%cur.length;
    cur[heroIdx]&&cur[heroIdx].classList.add('active');
    dots[heroIdx]&&dots[heroIdx].classList.add('on');
  },4500);
}

function tipLine(key,text){

function dismissTip(key){ if(!state.settings.seen)state.settings.seen={}; state.settings.seen['tip_'+key]=true; persist(); render(); }
function nudge(ico,text){ return `<div class="nudge"><div class="nu-ico">${ico}</div><div class="nu-t">${text}</div></div>`; }
function renderNudge(){
  const b=activeBaby(); if(!b)return '';
  const recent=babyMilestones().filter(m=>now()-m.achievedAt<3*86400000).sort((a,b)=>b.achievedAt-a.achievedAt)[0];
  if(recent) return nudge('🎉', `${escapeHtml(b.name)} just reached "${escapeHtml(recent.title)}". One for the baby book.`);
  if(!heroPhotos().length) return nudge('📸', 'Add a photo in Album and it becomes your home slideshow.');
  const months=babyMonths();
  const up=MILESTONES.filter(m=>!achievedOf(m.key)).sort((a,b)=>Math.abs(a.mo-months)-Math.abs(b.mo-months))[0];
  if(up) return nudge('✨', `Around now, lots of babies are working on "${escapeHtml(up.title)}". Every baby in their own time.`);
  const todayN=babyEvents().filter(e=>dayKey(e.time)===dayKey(now())).length;
  if(todayN>0) return nudge('🌿', `${todayN} thing${todayN>1?'s':''} logged today. You've got this.`);

}

function renderTimeline(){
  const evs = babyEvents();

    html+=`<div class="day-group"><div class="day-head">${dayLabel(list[0].time)}
      <span class="day-sum">${feeds} feeds · ${sleepMs?fmtDur(sleepMs):'0m'} sleep · ${dia} diapers</span></div>`;
    list.forEach(e=>html+=tlItem(e));
    html+='</div>';

}
function eventTitle(e){
  if(e.type==='feed'){
    if(e.method==='breast') return 'Nursed'+(e.side?(' · '+e.side):'');
    if(e.method==='bottle') return 'Bottle'+(e.content==='formula'?' · formula':e.content==='breastmilk'?' · breast milk':'');
    if(e.method==='solids') return 'Solids';
    if(e.method==='water') return 'Water';
    return 'Feed';
  }
  if(e.type==='sleep') return e.end?'Slept':'Sleep';
  if(e.type==='diaper') return 'Diaper · '+(e.kind||'');
  if(e.type==='pump') return 'Pumped';
  if(e.type==='note') return e.title||'Note';
  if(e.type==='activity') return e.activity||'Note';
  if(e.type==='medicine') return e.medName||'Medicine';
  if(e.type==='milestone') return e.title||'Milestone';
  if(e.type==='growth') return 'Measured';
  if(e.type==='vaccine') return e.vName||'Vaccine';
  if(e.type==='temperature') return 'Temperature';
  if(e.type==='symptom') return e.symptom||'Symptom';
  if(e.type==='visit') return e.reason||'Doctor visit';
  return 'Event';
}
function eventDetail(e){
  if(e.type==='feed'){
    if(e.method==='breast'&&e.dur) return fmtDur(e.dur);
    if(e.method==='bottle'&&e.amount) return e.amount+' '+(e.unit||'ml');
    if(e.method==='water') return e.amount?e.amount+' '+(e.unit||'ml'):'a few sips';
    if(e.method==='solids'){ const a=[]; if(e.notes)a.push(e.notes); if(e.amount)a.push(fmtSolidAmt(e.amount,e.unit)); return a.join(' · '); }
    return '';
  }
  if(e.type==='sleep'&&e.end) return fmtDur(e.end-e.time);
  if(e.type==='pump') return (e.amount?e.amount+' '+(e.unit||'ml'):'')+(e.side?' · '+e.side:'');
  if(e.type==='note') return e.notes||'';
  if(e.type==='activity'){ const a=[]; if(e.mins)a.push(e.mins+' min'); if(e.notes)a.push(e.notes); return a.join(' · '); }
  if(e.type==='medicine') return (e.dose?e.dose+' '+(e.unit||''):'')+(e.notes?' · '+e.notes:'');
  if(e.type==='growth'){ const a=[]; if(e.weight)a.push(e.weight+' '+(e.wUnit||'kg')); if(e.height)a.push(e.height+' '+(e.hUnit||'cm')); return a.join(' · '); }
  if(e.type==='vaccine') return e.notes||'';
  if(e.type==='temperature') return (e.temp!=null?e.temp+'°'+(e.unit||'C'):'')+(e.temp!=null&&isFever(e.temp,e.unit)?' · fever':'');
  if(e.type==='symptom') return (e.severity?e.severity:'')+(e.notes?' · '+e.notes:'');
  if(e.type==='visit'){ const p=[]; if(e.doctorName)p.push(e.doctorName); if(e.notes)p.push(e.notes); return p.join(' · '); }
  if(e.type==='diaper'&&e.notes) return e.notes;
  return '';
}
const ACTIVITY_ICONS={'Tummy time':'tummy','Bath':'bath','Massage':'massage','Play':'play','Walk':'walk','Sun time':'sun','Reading':'book','Skin-to-skin':'heart'};
function activityIcon(name){ const k=ACTIVITY_ICONS[name]; return k&&I[k]?I[k]:I.note; }
function illnessIcon(name){
  const n=(name||'').toLowerCase();
  if(n.includes('cold')) return I.snow;
  if(n.includes('flu')) return I.virus;
  if(n.includes('tummy')||n.includes('stomach')||n.includes('diarr')||n.includes('vomit')) return I.gut;
  if(n.includes('ear')) return I.ear;
  if(n.includes('teeth')||n.includes('tooth')) return I.tooth;
  return I.thermo;
}
function authorTag(e){
  if(!e || !e.authorId) return '';
  var info = (window.LL && window.LL.memberInfo) || {};
  var m = info[e.authorId];
  if(!m) return '';
  var label = m.relationship || (m.name ? String(m.name).split(' ')[0] : '') || 'Someone';
  var me = window.LL && window.LL.auth && window.LL.auth.currentUser && window.LL.auth.currentUser.uid;
  if(e.authorId === me) label += ' (you)';
  return label;
}
function tlItem(e){
  const m=TYPE_META[e.type];
  const det=eventDetail(e);
  const icon = e.type==='activity' ? activityIcon(e.activity) : m.icon;
  const by = authorTag(e);
  return `<div class="tl-item" onclick="openEdit('${e.id}')">
    <div class="tl-ico" style="background:var(--${m.c}-soft);color:var(--${m.c})">${icon}</div>
    <div class="tl-body"><div class="t1">${escapeHtml(eventTitle(e))}</div>${det?`<div class="t2">${escapeHtml(det)}</div>`:''}${by?`<div class="tl-by">${(e.authorId&&typeof window.memberAvatarSvg==='function')?`<span class="tl-byav">${window.memberAvatarSvg(e.authorId,16)}</span>`:''}logged by ${escapeHtml(by)}</div>`:''}</div>
    ${e.photoId&&photoSrc(e.photoId)?`<img class="tl-thumb" src="${photoSrc(e.photoId)}">`:''}
    <div class="tl-time"><div class="clock">${fmtClock(e.time)}</div><div class="ago" data-since="${e.time}">${fmtSince(e.time)}</div></div>
  </div>`;
}

/* ---------- STATS ---------- */
function renderStats(){
  const evs = babyEvents();
  const days=[];
  for(let i=6;i>=0;i--){ const d=new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate()-i); days.push(d); }
  const feedData=days.map(d=>{
    const k=dayKey(d.getTime());
    return evs.filter(e=>e.type==='feed'&&dayKey(e.time)===k).length;
  });
  const sleepData=days.map(d=>{
    const k=dayKey(d.getTime());
    const ms=evs.filter(e=>e.type==='sleep'&&e.end&&dayKey(e.time)===k).reduce((a,e)=>a+(e.end-e.time),0);
    return +(ms/3600000).toFixed(1);
  });
  const diaperData=days.map(d=>{
    const k=dayKey(d.getTime());
    return evs.filter(e=>e.type==='diaper'&&dayKey(e.time)===k).length;
  });
  const labels=days.map(d=>['S','M','T','W','T','F','S'][d.getDay()]);

  const avgFeed=(feedData.reduce((a,b)=>a+b,0)/7).toFixed(1);
  const avgSleep=(sleepData.reduce((a,b)=>a+b,0)/7).toFixed(1);
  const avgDia=(diaperData.reduce((a,b)=>a+b,0)/7).toFixed(1);

  return `<div class="fade-in">
    <div class="avg-row">
      <div class="avg-box"><div class="n" style="color:var(--feed)">${avgFeed}</div><div class="l">Avg feeds / day</div></div>
      <div class="avg-box"><div class="n" style="color:var(--sleep)">${avgSleep}h</div><div class="l">Avg sleep / day</div></div>
      <div class="avg-box"><div class="n" style="color:var(--diaper)">${avgDia}</div><div class="l">Avg diapers / day</div></div>
    </div>
    ${barCard('Feeds','Last 7 days',feedData,labels,'feed','')}
    ${barCard('Sleep','Hours per day',sleepData,labels,'sleep','h')}
    ${barCard('Diapers','Last 7 days',diaperData,labels,'diaper','')}
    ${renderGrowthSection()}
  </div>`;
}
function barCard(title,sub,data,labels,color,suffix){
  const max=Math.max(...data,1);
  let bars='';
  data.forEach((v,i)=>{
    const h=Math.round((v/max)*100);
    bars+=`<div class="bar-col">
      <div class="bar-val" style="color:var(--${color})">${v?v+suffix:''}</div>
      <div class="bar-track"><div class="bar" style="height:${v?h:0}%;background:var(--${color})"></div></div>
      <div class="bar-day">${labels[i]}</div>
    </div>`;
  });

const SOLID_FOODS=[
  {n:'Banana'},{n:'Avocado'},{n:'Sweet potato'},{n:'Oats',a:'gluten'},{n:'Apple'},{n:'Pear'},
  {n:'Carrot'},{n:'Peas'},{n:'Pumpkin'},{n:'Lentils'},{n:'Rice'},{n:'Tofu',a:'soy'},
  {n:'Yogurt',dairy:1,a:'dairy'},{n:'Cheese',dairy:1,a:'dairy'},{n:'Egg',egg:1,a:'egg'},
  {n:'Chicken',meat:1},{n:'Fish',meat:1,a:'fish'}
];
const ALLERGENS=['Dairy','Egg','Peanut','Tree nuts','Soy','Gluten','Fish','Shellfish','Sesame'];
function dietFoods(diet){
  return SOLID_FOODS.filter(f=>{
    if(diet==='vegan') return !f.meat && !f.dairy && !f.egg;
    if(diet==='veg') return !f.meat;
    return true;
  });
}
function capWord(s){ return (s||'').replace(/\b\w/g,c=>c.toUpperCase()); }
const SOLID_UNITS=['tsp','tbsp','cup','ml','oz','g','piece','jar','pouch'];
function fmtSolidAmt(amount,unit){
  unit=unit||'tbsp';
  const plural={piece:'pieces',jar:'jars',pouch:'pouches'};
  if(plural[unit] && amount!==1) return amount+' '+plural[unit];
  return amount+' '+unit;
}
function toggleSolidFood(f){
  if(!feedDraft.foods)feedDraft.foods=[];
  const i=feedDraft.foods.indexOf(f);
  if(i>=0)feedDraft.foods.splice(i,1); else feedDraft.foods.push(f);
  renderFeedSheet();
}
function loadFoodPhoto(input){

async function saveSolids(){
  const extra=$('#solidNote')?$('#solidNote').value.trim():'';

  if(feedDraft.photoData){ const pid=uid(); await PhotoStore.set(pid,feedDraft.photoData); payload.photoId=pid; }

async function maybeDelPhoto(pid){
  if(!pid)return;

function savePastSleep(){
  const ongoing = $('#sOngoing') && $('#sOngoing').checked;
  let s = getWhen('when');
  if(ongoing){
    if(s>now()) s-=86400000; // start can't be in the future
    const targets=targetsResolved();
    targets.forEach(bid=>{ timersFor(bid).sleep={start:s}; });
    persist(); closeSheet(); go('home'); render();
    toast(targets.length>1?'Naps in progress · sweet dreams':'Nap in progress · asleep since '+fmtClock(s));
    return;
  }
  let e = getWhen('end');
  if(e<=s) e+=86400000; // awake after midnight -> next day
  commitEvent({type:'sleep',time:s,end:e});
  closeSheet(); render(); toast('Nap logged · '+fmtDur(e-s));
}

function saveEdit(id){
  const e=state.events.find(x=>x.id===id); if(!e)return;
  const nt=$('#eTime').value;
  if(nt){ const old=new Date(e.time); const[h,m]=nt.split(':').map(Number); old.setHours(h,m); 
    const delta=old.getTime()-e.time; e.time=old.getTime(); if(e.end)e.end+=delta; }
  if($('#eAmt')) e.amount=+$('#eAmt').value;
  if($('#eMins')) e.mins=parseInt($('#eMins').value,10)||null;
  if($('#eNote')) e.notes=$('#eNote').value;

function babyMeds(){ return (state.meds||[]).filter(m=>m.babyId===state.activeBabyId); }
function lastDose(medId){ return babyEvents().find(e=>e.type==='medicine'&&e.medId===medId); }

function medNextDue(m){
  if(m.pattern.type==='asNeeded') return null;
  if(m.pattern.type==='everyX'){
    const last=lastDose(m.id);
    if(!last) return now(); // never given -> due now
    return last.time + m.pattern.hours*3600000;
  }
  if(m.pattern.type==='daily'){
    const times=(m.pattern.times||[]).slice().sort();
    if(!times.length) return null;
    const base=new Date(); base.setSeconds(0,0);
    for(const t of times){
      const [h,mm]=t.split(':').map(Number);
      const cand=new Date(); cand.setHours(h,mm,0,0);
      if(cand.getTime()>now()-60000) return cand.getTime();
    }
    // all passed -> first time tomorrow
    const [h,mm]=times[0].split(':').map(Number);
    const tm=new Date(); tm.setDate(tm.getDate()+1); tm.setHours(h,mm,0,0);
    return tm.getTime();
  }
  return null;
}
function fmtDue(ms){
  if(ms<=0){ const o=fmtDur(-ms); return -ms<60000?'due now':'overdue '+o; }
  return 'in '+fmtDur(ms);
}
function medScheduleText(m){
  if(m.pattern.type==='asNeeded') return 'As needed';
  if(m.pattern.type==='everyX') return 'Every '+m.pattern.hours+'h';
  if(m.pattern.type==='daily') return (m.pattern.times||[]).map(t=>fmtClock(timeToToday(t))).join(', ');
  return '';
}

function renderHomeMeds(){
  const meds=babyMeds().filter(m=>m.active);
  let rows=meds.map(m=>{
    const due=medNextDue(m);
    let sub;
    if(due===null) sub='As needed';
    else if(now()>=due) sub=`<span class="due">${fmtDue(due-now())}</span>`;
    else sub=`Next ${fmtClock(due)} · <span data-due="${due}">${fmtDue(due-now())}</span>`;
    return `<div class="med-card">
      <div class="mc-ico">${I.pill}</div>
      <div class="mc-body" onclick="openMedManage('${m.id}')"><div class="a">${escapeHtml(m.name)}</div><div class="b">${m.dose} ${m.unit} · ${sub}</div></div>
      <button class="dose-btn" onclick="logDose('${m.id}')">Dose</button>
    </div>`;
  }).join('');
  return `<div class="sec-title" style="margin-top:22px">Medicine</div>
    ${rows||''}
    <div class="add-row" onclick="openAddMed()">${I.plus} Add a medicine</div>`;
}

function logDose(id){

  addEvent({type:'medicine',medId:m.id,medName:m.name,dose:m.dose,unit:m.unit,time:now()});

/* ---- reminders ---- */
function requestNotif(){
  try{ if('Notification' in window && Notification.permission==='default') Notification.requestPermission(); }catch(e){}
}
function checkMedReminders(){
  let changed=false;
  babyMeds().filter(m=>m.active&&m.remind).forEach(m=>{
    const due=medNextDue(m);
    if(due!==null && now()>=due && m.lastNotified!==due){
      m.lastNotified=due; changed=true;
      const msg=m.name+' · '+m.dose+' '+m.unit+' is due';
      try{ if('Notification' in window && Notification.permission==='granted') new Notification('Medicine due', {body:msg}); }catch(e){}
      toast('⏰ '+msg);
    }
  });
  if(changed) persist();
}

/* ---- illness episodes, temperature & symptoms ---- */
const SYMPTOMS=['Fever','Cough','Runny nose','Congestion','Sore throat','Diarrhea','Vomiting','Rash','Ear pain','Reduced appetite','Fussy / irritable','Low energy','Wheezing','Constipation'];
function babyIllnesses(){ return (state.illnesses||[]).filter(i=>i.babyId===state.activeBabyId).sort((a,b)=>b.startedAt-a.startedAt); }
function activeIllness(){ return babyIllnesses().find(i=>!i.endedAt); }
function isFever(temp,unit){ if(temp==null)return false; return (unit==='F')? temp>=100.4 : temp>=38; }
function tempEvents(illnessId){ return babyEvents().filter(e=>e.type==='temperature'&&(!illnessId||e.illnessId===illnessId)); }
function lastTemp(illnessId){ const t=tempEvents(illnessId).sort((a,b)=>b.time-a.time); return t.length?t[0]:null; }

function renderIllness(){
  const ill=activeIllness();
  const tu=state.settings.tempUnit||'C';
  let head;
  if(ill){
    const days=Math.max(0,Math.floor((now()-ill.startedAt)/86400000))+1;
    const temps=tempEvents(ill.id).sort((a,b)=>a.time-b.time);
    const pts=temps.map(e=>({t:e.time, v:+(tu==='F'?(e.unit==='C'?e.temp*9/5+32:e.temp):(e.unit==='F'?(e.temp-32)*5/9:e.temp)).toFixed(1)}));
    const lt=lastTemp(ill.id);
    const syms=babyEvents().filter(e=>e.type==='symptom'&&e.illnessId===ill.id).slice(0,8);
    const doses=babyEvents().filter(e=>e.type==='medicine'&&e.time>=ill.startedAt);
    head=`<div class="med-due" style="background:var(--pump);margin-top:4px">${illnessIcon(ill.name)}
        <div class="info"><div class="lbl">Day ${days} · since ${new Date(ill.startedAt).toLocaleDateString(undefined,{month:'short',day:'numeric'})}</div>
        <div class="nm">${escapeHtml(ill.name)}</div>
        <div class="sub">${lt?('last temp '+lt.temp+'°'+(lt.unit||'C')+(isFever(lt.temp,lt.unit)?' · fever':'')):'no temperature logged yet'}</div></div></div>
      <div class="row2"><button class="btn-primary" style="background:var(--med)" onclick="openTemp()">${I.thermo} Temperature</button>
        <button class="btn-primary" style="background:var(--pump)" onclick="openSymptom()">${I.pulse} Symptom</button></div>
      ${pts.length?`<div class="stat-card" style="margin-top:14px"><h3>Temperature</h3><div class="csub">${pts.length} reading${pts.length>1?'s':''} · °${tu} · fever ≥ ${tu==='F'?'100.4':'38'}°</div>${svgLine(pts,'med','°'+tu)}</div>`:''}
      ${syms.length?`<div class="sec-title">Recent symptoms</div>${syms.map(s=>`<div class="tl-item" onclick="openEdit('${s.id}')"><div class="tl-ico" style="background:var(--pump-soft);color:var(--pump)">${I.pulse}</div><div class="tl-body"><div class="t1">${escapeHtml(s.symptom)}</div><div class="t2">${s.severity||''} · ${fmtClock(s.time)}</div></div></div>`).join('')}`:''}
      ${doses.length?`<div class="sec-title">Medicine given this illness</div>${doses.slice(0,6).map(d=>`<div class="tl-item"><div class="tl-ico" style="background:var(--med-soft);color:var(--med)">${I.pill}</div><div class="tl-body"><div class="t1">${escapeHtml(d.medName||'Medicine')}</div><div class="t2">${d.dose||''} ${d.unit||''} · ${new Date(d.time).toLocaleDateString(undefined,{month:'short',day:'numeric'})} ${fmtClock(d.time)}</div></div></div>`).join('')}`:''}
      <button class="btn-primary" style="background:var(--diaper);margin-top:16px" onclick="endIllness('${ill.id}')">${I.check} Mark recovered</button>`;
  } else {
    head=`<div class="stat-card" style="text-align:center"><h3>Everyone's well 🌿</h3><div class="csub" style="margin-bottom:14px">When they're under the weather, log it here to keep track of temperature, symptoms and the medicine you give.</div>
      <button class="btn-primary" style="background:var(--med)" onclick="openStartIllness()">${I.thermo} Log an illness</button></div>`;
  }
  // history
  const past=babyIllnesses().filter(i=>i.endedAt);
  let hist='';
  if(past.length){
    hist=`<div class="sec-title">Past illnesses</div>`+past.map(i=>{
      const dur=Math.max(1,Math.round((i.endedAt-i.startedAt)/86400000));
      return `<div class="tl-item" onclick="reopenIllness('${i.id}')"><div class="tl-ico" style="background:var(--pump-soft);color:var(--pump)">${illnessIcon(i.name)}</div>
        <div class="tl-body"><div class="t1">${escapeHtml(i.name)}</div><div class="t2">${new Date(i.startedAt).toLocaleDateString(undefined,{month:'short',day:'numeric'})} · ${dur} day${dur>1?'s':''}</div></div></div>`;
    }).join('');
  }
  return head+hist;
}

function startIllness(name){
  name=(typeof name==='string'?name:'Illness').trim()||'Illness';
  state.illnesses.push({id:uid(),babyId:state.activeBabyId,name,startedAt:now(),endedAt:null,notes:''});
  persist(); closeSheet(); healthTab='illness'; render(); toast('Logged '+name+' · hope it passes soon');
}
function endIllness(id){
  const i=(state.illnesses||[]).find(x=>x.id===id); if(i){ i.endedAt=now(); }
  persist(); render(); toast('All better 🌿');
}
function reopenIllness(id){
  const i=(state.illnesses||[]).find(x=>x.id===id); if(!i)return;
  openSheet(`<h2>${escapeHtml(i.name)}</h2><div class="sub">${new Date(i.startedAt).toLocaleDateString()} – ${i.endedAt?new Date(i.endedAt).toLocaleDateString():'ongoing'}</div>

    <button class="btn-ghost btn-danger" onclick="deleteIllness('${id}')">${I.trash} Delete record</button>`,'med');
}
function resumeIllness(id){ const i=(state.illnesses||[]).find(x=>x.id===id); if(i)i.endedAt=null; persist(); closeSheet(); healthTab='illness'; render(); }
function deleteIllness(id){ state.illnesses=(state.illnesses||[]).filter(x=>x.id!==id); persist(); closeSheet(); render(); toast('Deleted'); }

/* ---------- fever nudge ---------- */
function lastFeverEvent(){ const e=babyEvents().find(x=>x.type==='temperature'&&isFever(x.temp,x.unit)); return (e && now()-e.time<24*3600000)?e:null; }
function feverGuidance(){
  const b=activeBaby(); const mo=b?babyMonths():null;
  if(mo!=null && mo<3) return 'For a baby under 3 months, any fever is worth a prompt call to your doctor.';
  return 'Keep them comfortable and hydrated. Reach out to your doctor if the fever is high, lasts more than a day or two, or they just seem unwell.';
}
function openFeverNudge(v,unit){
  openSheet(`<h2>That's a fever</h2><div class="sub">${v}°${unit} is at or above the fever line (38°C / 100.4°F).</div>
    <div class="csub" style="margin:-4px 0 16px">${feverGuidance()} This isn't medical advice, trust your instincts and your pediatrician.</div>
    <button class="btn-primary" style="background:var(--sleep)" onclick="closeSheet();openVisitSummary()">${I.stetho} Prepare a summary for the doctor</button>
    <button class="btn-ghost" onclick="closeSheet();openSymptom()">Log a symptom</button>
    <button class="btn-ghost" onclick="closeSheet()">Got it</button>`,'med');
}
/* ---------- doctor visit summary ---------- */
function upcomingVisit(){
  const b=activeBaby(); if(!b||!b.doctors) return null;
  let best=null;
  b.doctors.forEach(dc=>{ if(dc.nextVisit){ const t=new Date(dc.nextVisit+'T12:00').getTime(); const days=(t-now())/86400000; if(days>=-0.5 && days<=3 && (!best||t<best.t)) best={t:t,name:dc.name||dc.role||'Doctor'}; } });
  return best;
}
function visitSummary(days){
  days=days||7;
  const b=activeBaby();
  const since=now()-days*86400000;
  const evs=babyEvents().filter(e=>e.time>=since);
  const perDay=(n)=>days>0?(n/days):n;
  const feeds=evs.filter(e=>e.type==='feed');
  const nursing=feeds.filter(e=>e.method==='breast').length;
  const bottles=feeds.filter(e=>e.method==='bottle');
  const solids=feeds.filter(e=>e.method==='solids').length;
  const water=feeds.filter(e=>e.method==='water').length;
  const bottleVol=bottles.reduce((a,e)=>a+(+e.amount||0),0);
  const sleeps=evs.filter(e=>e.type==='sleep'&&e.end);
  const sleepMs=sleeps.reduce((a,e)=>a+(e.end-e.time),0);
  const diapers=evs.filter(e=>e.type==='diaper');
  const wet=diapers.filter(e=>e.kind==='wet'||e.kind==='both').length;
  const dirty=diapers.filter(e=>e.kind==='dirty'||e.kind==='both').length;
  const temps=evs.filter(e=>e.type==='temperature');
  const fevers=temps.filter(e=>isFever(e.temp,e.unit));
  let maxTemp=null; temps.forEach(e=>{ if(maxTemp==null||e.temp>maxTemp.temp) maxTemp=e; });
  const symptoms=evs.filter(e=>e.type==='symptom');
  const lw=lastGrowth('weight'), lh=lastGrowth('height');
  const meds=babyMeds().filter(m=>m.active);
  const L=[];
  L.push(`Cubby summary, ${b.name} (${ageString(b.birth)})`);
  L.push(`Last ${days} days (through ${new Date().toLocaleDateString()})`);
  L.push('');
  L.push(`Feeds: ${feeds.length} total (~${perDay(feeds.length).toFixed(1)}/day)`);
  if(nursing) L.push(`  • Nursing: ${nursing}`);
  if(bottles.length) L.push(`  • Bottles: ${bottles.length}${bottleVol?` (~${Math.round(perDay(bottleVol))} ${bottles[0].unit||'ml'}/day)`:''}`);
  if(solids) L.push(`  • Solids: ${solids}`);
  if(water) L.push(`  • Water: ${water}`);
  L.push(`Sleep: ~${(perDay(sleepMs)/3600000).toFixed(1)} h/day (${sleeps.length} naps logged)`);
  L.push(`Diapers: ~${perDay(diapers.length).toFixed(1)}/day (wet ${wet}, dirty ${dirty})`);
  if(lw||lh) L.push(`Latest growth: ${lw?lw.weight+' '+(lw.wUnit||'kg'):''}${lw&&lh?', ':''}${lh?lh.height+' '+(lh.hUnit||'cm'):''}`);
  if(temps.length) L.push(`Temperature: ${temps.length} reading(s), max ${maxTemp.temp}°${maxTemp.unit||'C'}${fevers.length?` · ${fevers.length} fever reading(s)`:''}`);
  if(symptoms.length) L.push(`Symptoms: ${symptoms.map(s=>s.symptom+(s.severity?` (${s.severity})`:'')).join(', ')}`);
  if(meds.length) L.push(`Medicines: ${meds.map(m=>m.name+' '+m.dose+(m.unit||'')).join(', ')}`);
  if((b.allergies||[]).length) L.push(`Allergies: ${b.allergies.map(capWord).join(', ')}`);
  return L.join('\n');
}
function openVisitSummary(){
  const b=activeBaby(); if(!b) return;
  const text=visitSummary(7);
  openSheet(`<h2>Visit summary</h2><div class="sub">A snapshot of ${escapeHtml(b.name)}'s last 7 days for your appointment.</div>
    <pre class="visit-sum">${escapeHtml(text)}</pre>
    <button class="btn-primary" style="background:var(--sleep)" onclick="copyVisitSummary()">${I.list||''} Copy summary</button>
    <button class="btn-ghost" onclick="closeSheet()">Close</button>`,'sleep');
  window.__visitSummaryText=text;
}
function copyVisitSummary(){
  const t=window.__visitSummaryText||'';
  const done=()=>toast('Summary copied');
  if(navigator.share){ navigator.share({title:'Cubby summary',text:t}).then(done).catch(()=>{ if(navigator.clipboard) navigator.clipboard.writeText(t).then(done); }); }
  else if(navigator.clipboard){ navigator.clipboard.writeText(t).then(done).catch(()=>{}); }
  else done();
}

function growthEvents(){ return babyEvents().filter(e=>e.type==='growth').sort((a,b)=>a.time-b.time); }
function lastGrowth(field){ const g=growthEvents().filter(e=>e[field]); return g.length?g[g.length-1]:null; }
function convW(v,from,to){ if(from===to)return v; return from==='kg'? v*2.20462 : v/2.20462; }
function convH(v,from,to){ if(from===to)return v; return from==='cm'? v/2.54 : v*2.54; }

/* ---------- growth percentile charts (WHO / CDC) ---------- */
let growthSource='who';
function setGrowthSource(s){ growthSource=s; render(); }
function setBabySex(s){ const b=activeBaby(); if(!b)return; b.sex=s; persist(); render(); }
function growthRef(meas){ const b=activeBaby(); const sex=b&&b.sex; if(!sex||!window.GROWTH_REF)return null; const src=window.GROWTH_REF[growthSource]; return (src&&src[meas]&&src[meas][sex])||null; }
function refConv(meas,v,unit){ return meas==='weight'?convW(v,'kg',unit):convH(v,'cm',unit); }
function babyAgeMonths(t){ const b=activeBaby(); return (b&&b.birth)?((t-b.birth)/2629800000):null; }
function interpBands(ref,mo){
  if(mo<=ref[0][0]) return ref[0].slice(1);
  if(mo>=ref[ref.length-1][0]) return ref[ref.length-1].slice(1);
  for(let i=1;i<ref.length;i++){ if(mo<=ref[i][0]){ const a=ref[i-1],b=ref[i],f=(mo-a[0])/((b[0]-a[0])||1); return [1,2,3,4,5].map(k=>a[k]+(b[k]-a[k])*f); } }
  return ref[ref.length-1].slice(1);
}
function estPercentile(meas,unit){
  const ref=growthRef(meas); if(!ref)return null;
  const g=growthEvents().filter(e=>e[meas]); if(!g.length)return null;
  const e=g[g.length-1], mo=babyAgeMonths(e.time);
  if(mo==null||mo<0||mo>ref[ref.length-1][0]+0.6)return null;
  const val=meas==='weight'?convW(e.weight,e.wUnit||'kg',unit):convH(e.height,e.hUnit||'cm',unit);
  const bands=interpBands(ref,mo).map(v=>refConv(meas,v,unit)), ps=[5,25,50,75,95];
  if(val<=bands[0])return '<5th'; if(val>=bands[4])return '>95th';
  for(let i=1;i<5;i++){ if(val<=bands[i]){ const f=(val-bands[i-1])/((bands[i]-bands[i-1])||1); return Math.round(ps[i-1]+(ps[i]-ps[i-1])*f)+'th'; } }
  return '50th';
}
function pctLabel(meas,unit){ const p=estPercentile(meas,unit); return p?` · latest ~${p}`:''; }
function growthControls(b){
  return `<div class="gx-ctrl">
    <div class="gx-seg">${['who','cdc'].map(s=>`<button class="${growthSource===s?'on':''}" onclick="setGrowthSource('${s}')">${s.toUpperCase()}</button>`).join('')}</div>
    <div class="gx-seg">${[['M','Boy'],['F','Girl']].map(o=>`<button class="${b&&b.sex===o[0]?'on':''}" onclick="setBabySex('${o[0]}')">${o[1]}</button>`).join('')}</div>
  </div>`;
}
function svgPercentile(meas,unit){
  const ref=growthRef(meas); if(!ref)return '';
  const W=320,H=180,padL=30,padR=12,padT=12,padB=20;
  const XM=ref[ref.length-1][0];
  const bpts=growthEvents().filter(e=>e[meas]).map(e=>({mo:babyAgeMonths(e.time), v:(meas==='weight'?convW(e.weight,e.wUnit||'kg',unit):convH(e.height,e.hUnit||'cm',unit))})).filter(p=>p.mo!=null&&p.mo>=0).sort((a,b)=>a.mo-b.mo);
  let lo=Infinity,hi=-Infinity;
  ref.forEach(r=>{ lo=Math.min(lo,refConv(meas,r[1],unit)); hi=Math.max(hi,refConv(meas,r[5],unit)); });
  bpts.forEach(p=>{ if(p.mo<=XM){ lo=Math.min(lo,p.v); hi=Math.max(hi,p.v); } });
  const vp=(hi-lo)*0.08||1; lo-=vp; hi+=vp;
  const X=mo=>padL+(Math.min(mo,XM)/XM)*(W-padL-padR);
  const Y=v=>padT+(1-((v-lo)/((hi-lo)||1)))*(H-padT-padB);
  const bandPath=idx=>ref.map((r,i)=>(i?'L':'M')+X(r[0]).toFixed(1)+' '+Y(refConv(meas,r[idx],unit)).toFixed(1)).join(' ');
  const top=ref.map((r,i)=>(i?'L':'M')+X(r[0]).toFixed(1)+' '+Y(refConv(meas,r[5],unit)).toFixed(1)).join(' ');
  const botR=ref.slice().reverse().map(r=>'L'+X(r[0]).toFixed(1)+' '+Y(refConv(meas,r[1],unit)).toFixed(1)).join(' ');
  const col=meas==='weight'?'var(--feed)':'var(--sleep)';
  const bands=[1,2,3,4,5].map(idx=>`<path d="${bandPath(idx)}" fill="none" stroke="${idx===3?'var(--ink-soft)':'var(--line)'}" stroke-width="${idx===3?1.4:1}" ${idx===3?'':'stroke-dasharray="2 2"'}/>`).join('');
  const bl=bpts.map((p,i)=>(i?'L':'M')+X(p.mo).toFixed(1)+' '+Y(p.v).toFixed(1)).join(' ');
  const dots=bpts.map(p=>`<circle cx="${X(p.mo).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="3.2" fill="${col}" stroke="#fff" stroke-width="1.5"/>`).join('');
  let xt=''; for(let m=0;m<=XM;m+=6){ xt+=`<text x="${X(m).toFixed(1)}" y="${H-5}" text-anchor="middle" font-size="9" fill="var(--ink-faint)">${m}m</text>`; }
  const lbl=`<text x="${W-padR}" y="${(Y(refConv(meas,ref[ref.length-1][5],unit))-2).toFixed(1)}" text-anchor="end" font-size="8" fill="var(--ink-faint)">95th</text><text x="${W-padR}" y="${(Y(refConv(meas,ref[ref.length-1][1],unit))+8).toFixed(1)}" text-anchor="end" font-size="8" fill="var(--ink-faint)">5th</text>`;
  return `<svg class="growth-line" viewBox="0 0 ${W} ${H}"><path d="${top+' '+botR+' Z'}" fill="${col}" opacity="0.07"/>${bands}${lbl}<path d="${bl}" fill="none" stroke="${col}" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>${dots}${xt}</svg>`;
}

    return `<div class="sec-title" style="margin-top:24px">Growth</div>

      <button class="btn-primary" style="background:var(--diaper);margin-top:12px" onclick="openGrowth()">${I.scale} Add weight & height</button></div>`;
  }
  const wU=state.settings.wUnit||'kg', hU=state.settings.hUnit||'cm';
  const wPts=g.filter(e=>e.weight).map(e=>({t:e.time, v:+convW(e.weight, e.wUnit||'kg', wU).toFixed(2)}));
  const hPts=g.filter(e=>e.height).map(e=>({t:e.time, v:+convH(e.height, e.hUnit||'cm', hU).toFixed(1)}));
  const lw=lastGrowth('weight'), lh=lastGrowth('height');
  const wDelta=growthDelta(wPts), hDelta=growthDelta(hPts);
  return `<div class="sec-title" style="margin-top:24px">Growth</div>
    <div class="gx-stat">
      <div class="gx-box"><div class="n" style="color:var(--feed)">${lw?(+convW(lw.weight,lw.wUnit||'kg',wU).toFixed(2)):'·'}${lw?' '+wU:''}</div><div class="l">Latest weight</div>${wDelta?`<div class="d" style="color:${wDelta>0?'var(--diaper)':'var(--med)'}">${wDelta>0?'+':''}${wDelta} ${wU}</div>`:''}</div>
      <div class="gx-box"><div class="n" style="color:var(--sleep)">${lh?(+convH(lh.height,lh.hUnit||'cm',hU).toFixed(1)):'·'}${lh?' '+hU:''}</div><div class="l">Latest height</div>${hDelta?`<div class="d" style="color:${hDelta>0?'var(--diaper)':'var(--med)'}">${hDelta>0?'+':''}${hDelta} ${hU}</div>`:''}</div>
    </div>
    ${tipLine('growth','Set Boy/Girl to overlay WHO/CDC percentile curves behind the dots.')}
    ${growthControls(b)}
    ${(b&&b.sex)?'':`<div class="stat-card"><div class="csub" style="margin:0">Choose your baby's sex above to see WHO/CDC percentile curves behind their measurements.</div></div>`}
    ${wPts.length?`<div class="stat-card"><h3>Weight</h3><div class="csub">${(b&&b.sex)?growthSource.toUpperCase()+' percentiles'+pctLabel('weight',wU):wPts.length+' measurement'+(wPts.length>1?'s':'')} · ${wU}</div>${(b&&b.sex&&growthRef('weight'))?svgPercentile('weight',wU):svgLine(wPts,'feed',wU)}</div>`:''}
    ${hPts.length?`<div class="stat-card"><h3>Height</h3><div class="csub">${(b&&b.sex)?growthSource.toUpperCase()+' percentiles'+pctLabel('height',hU):hPts.length+' measurement'+(hPts.length>1?'s':'')} · ${hU}</div>${(b&&b.sex&&growthRef('height'))?svgPercentile('height',hU):svgLine(hPts,'sleep',hU)}</div>`:''}
    <div class="add-row" onclick="openGrowth()">${I.plus} Add a measurement</div>
    <p style="font-size:11.5px;color:var(--ink-faint);font-weight:600;text-align:center;margin-top:12px">${(b&&b.sex)?'Bands: '+(growthSource==='who'?'WHO Child Growth Standards (0–24 mo)':'CDC growth charts (0–36 mo)')+'. ':''}A guide, not a diagnosis, your pediatrician is the best judge.</p>`;
}
function growthDelta(pts){ if(pts.length<2)return null; const d=pts[pts.length-1].v-pts[pts.length-2].v; return +d.toFixed(2); }
function svgLine(pts,color,unit){
  const W=320,H=150,pad=30, top=14, bot=H-24;
  if(pts.length===1){ pts=[{t:pts[0].t-86400000,v:pts[0].v},pts[0]]; }
  const ts=pts.map(p=>p.t), vs=pts.map(p=>p.v);
  const tmin=Math.min(...ts), tmax=Math.max(...ts)||tmin+1, vmin=Math.min(...vs), vmax=Math.max(...vs);
  const vpad=(vmax-vmin)*0.2||vmax*0.1||1;
  const lo=vmin-vpad, hi=vmax+vpad;
  const x=t=>pad+((t-tmin)/((tmax-tmin)||1))*(W-pad-10);
  const y=v=>top+(1-((v-lo)/((hi-lo)||1)))*(bot-top);
  const line=pts.map((p,i)=>(i?'L':'M')+x(p.t).toFixed(1)+' '+y(p.v).toFixed(1)).join(' ');
  const area=`M${x(pts[0].t).toFixed(1)} ${bot} `+pts.map(p=>'L'+x(p.t).toFixed(1)+' '+y(p.v).toFixed(1)).join(' ')+` L${x(pts[pts.length-1].t).toFixed(1)} ${bot} Z`;
  const dots=pts.map(p=>`<circle cx="${x(p.t).toFixed(1)}" cy="${y(p.v).toFixed(1)}" r="3.5" fill="var(--${color})"/>`).join('');
  const d1=new Date(tmin).toLocaleDateString(undefined,{month:'short',day:'numeric'});
  const d2=new Date(tmax).toLocaleDateString(undefined,{month:'short',day:'numeric'});
  return `<svg class="growth-line" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="height:150px">
    <path d="${area}" fill="var(--${color})" opacity="0.12"/>
    <path d="${line}" fill="none" stroke="var(--${color})" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${dots}
    <text x="${pad}" y="${H-6}" font-size="10" font-weight="700" fill="var(--ink-faint)">${d1}</text>
    <text x="${W-10}" y="${H-6}" font-size="10" font-weight="700" fill="var(--ink-faint)" text-anchor="end">${d2}</text>
    <text x="${pad-4}" y="${y(hi-vpad).toFixed(1)}" font-size="10" font-weight="800" fill="var(--${color})" text-anchor="end">${(hi-vpad).toFixed(1)}</text>
  </svg>`;
}

const VX_GROUPS=['Birth','2 months','4 months','6 months','12 months','15-18 months','18 months'];

function vaccinePlan(){
  const id=state.activeBabyId;
  if(!state.vaccines) state.vaccines={};
  if(!state.vaccines[id]){
    state.vaccines[id]=DEFAULT_VACCINES.map(([name,group,dueMonths])=>({id:uid(),name,group,dueMonths,given:false,givenAt:null,note:''}));
    persist();
  }
  return state.vaccines[id];
}
function vxDueDate(v){ const b=activeBaby(); const birth=b&&b.birth?b.birth:now(); return birth + v.dueMonths*30.44*86400000; }
function vxStatus(v){
  if(v.given) return 'done';
  const due=vxDueDate(v), diff=due-now();
  if(diff<0) return 'overdue';
  if(diff<30*86400000) return 'soon';
  return 'upcoming';
}
function vaccineOverdue(){
  const od=vaccinePlan().filter(v=>!v.given && vxDueDate(v)<now()).sort((a,b)=>vxDueDate(a)-vxDueDate(b));
  if(!od.length) return null;
  const v=od[0]; v._due=vxDueDate(v); return v;
}

function renderVaccines(){
  const plan=vaccinePlan();
  const done=plan.filter(v=>v.given).length;
  const overdue=plan.filter(v=>vxStatus(v)==='overdue').length;
  const R=30,C=2*Math.PI*R,off=C-(done/(plan.length||1))*C;
  const groups={}; plan.forEach(v=>{ (groups[v.group]=groups[v.group]||[]).push(v); });
  const order=[...VX_GROUPS.filter(g=>groups[g]), ...Object.keys(groups).filter(g=>!VX_GROUPS.includes(g))];
  let list='';
  order.forEach(g=>{
    list+=`<div class="sec-title">${g}</div>`;
    groups[g].forEach(v=>{
      const st=vxStatus(v);
      const sub=v.given?('given '+new Date(v.givenAt).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'})):('due ~'+(v.dueMonths===0?'birth':v.dueMonths+' mo'));
      const lbl={done:'Done',overdue:'Overdue',soon:'Due soon',upcoming:'Upcoming'}[st];
      list+=`<div class="ms-row ${v.given?'done':''}" onclick="openVaccine('${v.id}')">
        <div class="ms-check" style="${v.given?'background:var(--diaper);border-color:var(--diaper)':''}">${I.check}</div>
        <div class="ms-body"><div class="a">${escapeHtml(v.name)}</div><div class="b">${sub}</div></div>
        <div class="vx-status ${st}">${lbl}</div></div>`;
    });
  });
  return `
    <div class="ms-hero">
      <div class="ring"><svg width="74" height="74"><circle cx="37" cy="37" r="${R}" fill="none" stroke="var(--line)" stroke-width="7"/>
        <circle cx="37" cy="37" r="${R}" fill="none" stroke="var(--diaper)" stroke-width="7" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${off}"/></svg>
        <div class="rt">${done}</div></div>
      <div class="mh-body"><div class="a">${done} of ${plan.length} done</div><div class="b">${overdue?overdue+' overdue · ':''}tap any vaccine to mark it given</div></div>
    </div>
    <div class="disclaimer">⚕️ This is the standard CDC/ACIP infant schedule as a starting template. Schedules vary by country (the UAE differs). Always follow your pediatrician and local health authority. Edit any item to match your child's actual plan.</div>
    ${list}
    <div class="add-row" onclick="openAddVaccine()">${I.plus} Add a vaccine</div>`;
}

        <div class="rt">${doneCount}</div></div>

    </div>
    ${upcoming.length?`<div class="sec-title">Coming up</div>${upcoming.map(m=>`<div class="ms-row" onclick="openMilestone('${m.key}')"><div class="ms-check">${I.check}</div><div class="ms-body"><div class="a">${escapeHtml(m.title)}</div><div class="b">typically around ${m.mo} months</div></div><div class="ms-chip">${escapeHtml(m.cat)}</div></div>`).join('')}`:''}
    ${customList?`<div class="sec-title">Your moments</div>${customList}`:''}

/* ============================================================
   PHOTO STUDIO  (canvas-based, all client side)
   ============================================================ */
const PHOTOS_KEY='little-log-photos-v1';
const PhotoStore={
  map:{},
  async load(){ try{ if(window.storage){ const r=await window.storage.get(PHOTOS_KEY); this.map=r&&r.value?JSON.parse(r.value):{}; } else if(typeof localStorage!=='undefined'){ const v=localStorage.getItem(PHOTOS_KEY); this.map=v?JSON.parse(v):{}; } }catch(e){ this.map=this.map||{}; } },
  async save(){ try{ if(window.storage){ await window.storage.set(PHOTOS_KEY, JSON.stringify(this.map)); } else if(typeof localStorage!=='undefined'){ localStorage.setItem(PHOTOS_KEY, JSON.stringify(this.map)); } }catch(e){} },
  async set(id,data){ this.map[id]=data; await this.save(); },
  async del(id){ delete this.map[id]; await this.save(); }
};
function photoSrc(id){ return PhotoStore.map[id]||''; }

function downscaleToData(file,maxDim,q,cb){
  const img=new Image();
  img.onload=()=>{
    let{width:w,height:h}=img;
    if(w>h&&w>maxDim){ h=h*maxDim/w; w=maxDim; }
    else if(h>maxDim){ w=w*maxDim/h; h=maxDim; }
    const c=document.createElement('canvas'); c.width=w; c.height=h;
    c.getContext('2d').drawImage(img,0,0,w,h);
    cb(c.toDataURL('image/jpeg',q));
  };
  img.src=URL.createObjectURL(file);
}

function renderHeatmap(){

    {label:'Nappies',color:'--diaper',val:k=>byDay[k].diaper, fmt:v=>v+' nappies'}
  ];
  const max={}; rows.forEach((r,i)=>{ max[i]=Math.max(1,...days.map(d=>r.val(dayKey(d.getTime())))); });

  const seg=`<div class="hm-seg"><button class="${logRange==='week'?'on':''}" onclick="setLogRange('week')">Week</button><button class="${logRange==='month'?'on':''}" onclick="setLogRange('month')">Month</button></div>`;
  return `<div class="hm"><div class="hm-top"><div class="sec-title" style="margin:0">At a glance</div>${seg}</div>${grid}${dayRow}</div>`;
