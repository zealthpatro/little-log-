<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>You look offline · Cubby</title>
<meta name="robots" content="noindex">
<meta name="description" content="You look offline. This page needs a connection; anything logged in Cubby is saved on your phone and syncs when you are back.">
<meta name="theme-color" content="#FBF3E9">
<link rel="icon" type="image/png" href="/icons/favicon.png">
<!-- Served by the root service worker when a page on this site cannot be reached. Until now that
     moment gave the visitor the browser's own error page, which is the one screen in the whole
     journey that looks like nothing to do with us: a parent taps a "good read" from inside Cubby, the
     train goes into a tunnel, and she gets a dinosaur.

     Everything is inline on purpose. This page is shown precisely when the network is gone, so a
     stylesheet or a font it had to fetch would arrive as unstyled text. The one external file is the
     balloon, which the service worker precaches for exactly this reason, and it hides itself rather
     than leaving a broken-image box if it is ever missing. -->
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  /* --accent is the brand rose and stays the brand rose for text and trim. --cta is the button fill,
     and it is a separate token for one reason: white on #C97FA0 measures 2.99:1, and this button is
     the only way off this page. 15px bold needs 4.5:1. */
  :root{--bg:#FBF3E9;--grad:#fdefe4;--ink:#2C2521;--soft:#6B5D50;--faint:#7A6E63;--card:#fff;--line:#ECE0D2;--accent:#C97FA0;--cta:#A85C82;--cta-ink:#fff;--shadow:rgba(60,40,25,.14);}
  /* The marketing site has no dark mode of its own, but this page can be the first thing somebody
     sees at 3am, so it follows the phone. */
  @media (prefers-color-scheme: dark){
    /* Dark keeps the pale rose as the fill and inverts the label, the way the app's pill does: white on
       #DFA0BC is 2.12:1, near-black on it is 8.8:1. */
    :root{--bg:#15110F;--grad:#211B18;--ink:#F2E9DF;--soft:#B8AA9C;--faint:#9C8E80;--card:#1E1815;--line:#2E2620;--accent:#DFA0BC;--cta:#DFA0BC;--cta-ink:#15110F;--shadow:rgba(0,0,0,.4);}
  }
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:radial-gradient(120% 80% at 50% 0%,var(--grad),var(--bg) 60%);color:var(--ink);
    min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px 18px;}
  .card{width:100%;max-width:420px;background:var(--card);border:1px solid var(--line);
    border-radius:26px;box-shadow:0 24px 60px var(--shadow);padding:30px 22px 26px;text-align:center;}
  .brand{font-size:13px;font-weight:800;color:var(--faint);letter-spacing:.04em;margin-bottom:18px;}
  .brand span{color:var(--accent);}
  img.art{width:150px;height:150px;display:block;margin:0 auto 16px;}
  h1{font-size:22px;font-weight:800;line-height:1.25;margin-bottom:8px;}
  p{font-size:14.5px;color:var(--soft);font-weight:600;line-height:1.55;}
  .acts{margin-top:20px;display:flex;flex-direction:column;gap:10px;align-items:center;}
  button,a.btn{min-height:44px;display:inline-flex;align-items:center;justify-content:center;
    border:none;background:var(--cta);color:var(--cta-ink);font-family:inherit;font-size:15px;font-weight:800;
    padding:12px 24px;border-radius:14px;cursor:pointer;text-decoration:none;}
  a.ghost{background:none;color:var(--soft);border:1.5px solid var(--line);}
  /* Any `display` set in this stylesheet outranks the UA stylesheet's [hidden]{display:none}, so the
     hidden "Open Cubby" link was rendering anyway and offering exactly the dead tap the probe below
     exists to prevent. Declared after the rules it has to beat, and !important so a later one cannot
     quietly undo it again. */
  [hidden]{display:none!important;}
  .note{font-size:12.5px;color:var(--faint);font-weight:700;margin-top:18px;line-height:1.5;}
</style>
</head>
