# Cubby: static site on Cloudflare Workers + a tiny edge worker that proxies
# the reserved Firebase namespace (/__/*) for same-domain Google sign-in.
name = "cubby"
main = "worker.js"
compatibility_date = "2025-06-01"

[assets]
directory = "./"
binding = "ASSETS"

# Non-secret config. Secrets (RESEND_API_KEY, FIREBASE_SERVICE_ACCOUNT) are set with
# `wrangler secret put` and never live in this file or the repo.
[vars]
MAIL_FROM = "Cubby <noreply@mail.little-cubby.com>"

# Per-IP rate limiter for the magic-link endpoint (worker.js sendSigninLink). Caps one IP to
# 5 POST /api/send-signin-link calls per 60s (per Cloudflare location), so the endpoint can't be
# abused to blast sign-in emails or burn the Resend quota. Available on all plans. period must be
# 10 or 60; namespace_id is any unique id for this account's limiter.
[[unsafe.bindings]]
name = "SIGNIN_RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

# Per-IP rate limiter for the newsletter opt-in endpoint (worker.js newsletterSignup). Same 5/60s/IP
# cap so the capture can't be flooded. Falls back to SIGNIN_RATE_LIMITER (distinct key prefix) if absent.
[[unsafe.bindings]]
name = "NEWSLETTER_RATE_LIMITER"
type = "ratelimit"
namespace_id = "1002"
simple = { limit = 5, period = 60 }
