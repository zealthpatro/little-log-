# Cubby: static site on Cloudflare Workers + a tiny edge worker that proxies
# the reserved Firebase namespace (/__/*) for same-domain Google sign-in.
name = "cubby"
main = "worker.js"
compatibility_date = "2025-06-01"

# Every 15 minutes: send due push reminders (worker.js scheduled -> sendPushReminders). 15-min
# granularity so a medicine reminder lands ~30 to 15 min before the dose. Reads each user's
# precomputed reminder index from Firestore and sends via FCM. Isolated from fetch().
[triggers]
crons = ["*/15 * * * *"]

[assets]
directory = "./"
binding = "ASSETS"
# Serve the branded /404.html (with a real 404 status) for any unmatched path,
# instead of an empty-body 404.
#
# NOTE, measured on the wire 2026-08-22 and not what an earlier version of this comment claimed:
# Workers Static Assets serves any MATCHING asset without invoking worker.js at all. /, /app/ and
# /articles/ never reach the Worker; only unmatched paths do. So anything in fetch() that expects to
# see ordinary page traffic will see none of it — which is why recordPageView counts 404s and not page
# views (into D1, never the family Firestore). Set run_worker_first if that ever needs to change, and
# price it: it puts the Worker in front of every asset request, images and scripts included.
not_found_handling = "404-page"
# NAVIGATIONS skip the Worker too (measured 17 Nov 2026). With not_found_handling set and a
# compatibility_date of 2025-04-01 or later, a browser navigation (Sec-Fetch-Mode: navigate) to a path
# with no file gets the 404 page above straight from the asset layer, and worker.js never sees it. Two
# kinds of link are ONLY worker.js: the sign-in link in every sign-in email (/__/auth/action, proxied to
# Firebase) and a shared family game (/g/<code>). From 8 Jul 2026, when the 404 page arrived, both showed
# "That page moved or never existed" to every parent and guest who opened one in a browser, while every
# script and test (no navigation header) still reached the Worker. So the Worker runs first for these
# paths only; tools/live_nav_check.js asks production as a browser does (gates.js --live).
run_worker_first = ["/__/*", "/g/*"]

# Non-secret config. Secrets (RESEND_API_KEY, FIREBASE_SERVICE_ACCOUNT) are set with
# `wrangler secret put` and never live in this file or the repo.
[vars]
MAIL_FROM = "Cubby <noreply@mail.little-cubby.com>"
# Usage events (POST /api/usage; docs/superpowers/specs/2026-11-13-admin-dashboard-design.md §8.8). Every
# change of mode is a reviewed commit: off stores nothing; internal stores only the founder's own accounts
# (INTERNAL_UIDS secret); on measures families, and is flipped only as the last step of phase 3, after
# the privacy screens, the policy and the App Store answers are live.
USAGE_MODE = "off"
# Events stored per UTC day across everyone (a quarter of it for batches with no sign-in). Workers Free
# allows 100,000 D1 rows written a day for the whole account (shared with the games and the newsletter),
# and once it is spent D1 refuses every query. D1 bills one written row per row a statement inserts,
# updates or deletes, plus one per index entry the write touches. The worst UTC day, in billed rows, at
# cap C (families' share L = 3C/4):
#   storing          13 x C   a batch of one: day counter 1, usage_events 5 (WITHOUT ROWID, four indexes),
#                             a new usage_daily row 4, a device id never seen before 3 (row, key, dev_uid)
#   household fill    4 x L   a confirmed household fills its person's null rows from the last 24 hours,
#                             each row once (row and ue_hid_at): two days of the families' share at most
#   refusals          1,010   REFUSED_DAILY_ROWS (500) reason rows and their 500 counter writes, plus the
#                             key index of at most 9 new reason rows and the day's counter
#   membership        3,001   MEMBERSHIP_DAILY_ROWS (1,000) new rows (row and key) and their counter writes
#   retention and     5 x X   X = 9C/4 rows a day at most (worker.js retentionDailyRows), 5 each at worst,
#   erasure                   shared: an erasure (account or household purge, orphan sweep) deletes in steps
#                             that take their rows, and each step's own two, from the same allowance
#                             (workers/usage/core.mjs eraseStep), so a heavy family is spread over days.
#                             Until retention has finished a day it may take 2C + 100 of it, and erasures
#                             the rest, their floor, so neither waits behind the other
#   the rest            200   the first write of the two shares' and the erasures' day counters, the cron's
#                             own markers, and retention taking the erasures' unused floor at 23:45 UTC
# At 1,500 that is 19,500 + 4,500 + 1,010 + 3,001 + 16,875 + 200 = 45,086, under half with about 1,900 to
# spare below 47,000. Not in it: a household purge's pending marker, two rows, once per household, and an
# account purge's when the day has no room left for her, two rows, once per account. A step that fails
# keeps what it took of the day (D1 may bill a batch that rolled back). test/usage-erasure.test.js
# recomputes every term from the real schema and the real constants, and fails if the cap, an index or a
# ceiling breaks it. test/usage-d1-engine.test.js measures them on workerd's own D1 meter (rows_written): 13 a
# stored event, 2 a filled row, 2 a refusal, 3 a membership row, and 1 a deleted row, so the 5 above is a
# bound there, not the measure (31,586 on that meter at 1,500). Cloudflare's bill is not measured locally.
# Reads have a day too: D1 Free allows 5,000,000 rows read a day for the whole account, and past it D1
# refuses every query as well. A pending erasure is carried on every cron tick, 96 a day, and a tick whose
# day has no delete allowance left reads where the allowance stands and nothing more (core.mjs
# erasePending). Measured on workerd's own D1 (meta.rows_read) at this cap, erasePending every 15 minutes
# for one UTC day with one erasure pending:
#   a tick with no room       7 rows
#   a 10,000-row person       4,172 rows in the day when retention took 3,000 (one step, 3,507; 373 of hers
#                             erased); 26,896 on a quiet day (four steps of 4,929 to 7,826; 3,167 erased)
#   a 12,000-row household    20,993 (one step, 20,328) and 79,932 (four steps of 14,959 to 22,209), with
#                             1,000 other people's membership rows stored
# An erasure goes a batch of its visits at a time (the visits of its next 1,001 rows), so for visits as
# Cubby's tracker sends them (a visit's head arrives with its first other rows, or shortly before them, not
# ahead of a batch's worth of the household's other rows) a step reads about the same at any size: at most
# 7,647 for a person of 10,000 or 100,000 rows, 21,210 for a household of 12,000
# or 100,000 (visits of five rows, no membership rows; visits of two read up to 36,014), and 35,538 for one
# whose rows are half visits of a head alone (a phone in a crash loop). A household step also reads the
# membership table, which has no index on hid: whole in every step's plan, again in the step that unlinks
# its members (up to whole: it stops once it has them all) and whole again in the step that clears its
# marker, so a household small enough to go in one step reads it up to three times. With 10,000 other
# people's rows that adds 10,000 to 30,000 a step (30,027 a middle step, not 20,027; 33,579 for a 200-row
# household's one step, not 3,579), and it grows with everyone stored. An index would bill one more row for
# each new membership row (the 45,086 above becomes 46,086), so it is a phase-3 decision. Two shapes
# Cubby's tracker never sends cost more (an open question for phase 3, docs/ADMIN-DEPLOY.md). Many visits'
# heads sent first and their other rows later make every household step re-read all of those heads: up to
# 116,014 rows a step for 10,000 such visits and 316,014 for 30,000. One visit id reused across many rows
# makes a step read every row of it several times over: 89,037 rows for a household step and 45,006 for a
# person's, with one visit of 20,000. The day's delete allowance (3,375 rows) holds one erasure to at most
# five steps that delete rows in a UTC day, and to four unless its first step that day took only the
# erasures' floor (before retention finished the day) and retention then deleted under 92 rows. A person's
# erasure may run one more that day when her marker's hold ends, which clears it and takes any row of hers
# stored during the hold, and any erasure one more each time a row of it lands between the count and the
# deletes of the step that takes its last rows. Before, every
# tick ran the erasure's counts first, a person's step sorted every row she had and a household's listed
# every visit it had: that household read 5,096,632 rows a day, more than the account's whole allowance,
# and that person 1,022,630, every day they were pending. Retention's and the admin's reads are not
# budgeted here.
USAGE_DAILY_CAP = "1500"

# Per-IP rate limiter for the magic-link endpoint (worker.js sendSigninLink). Configured as 5 POST
# /api/send-signin-link calls per 60s per Cloudflare location, to stop the endpoint blasting sign-in
# emails or burning the Resend quota. Available on all plans. period must be 10 or 60; namespace_id
# is any unique id for this account's limiter.
# EVERY limit in this file is APPROXIMATE, and far looser than its number. Each machine checks a
# locally cached count and syncs in the background, so requests spread across one location's machines
# barely add up. Measured 2026-10-27 from one IP: at 1 a second, nothing was ever refused; in a burst,
# 6 of 100 dose calls in 5s were refused against 10/60s (strict would refuse 90), and 9 of 60
# invite-peek calls in 6s against this 5/60s (strict: 55). These limits blunt a flood. They do not
# enforce a number. docs/postmortems/2026-10-27-rate-limiters-never-denied.md.
[[unsafe.bindings]]
name = "SIGNIN_RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

# Per-IP rate limiter for the newsletter opt-in endpoint (worker.js newsletterSignup). Same 5/60s/IP
# cap so the capture can't be flooded. Falls back to SIGNIN_RATE_LIMITER (distinct key prefix) if absent.
[[unsafe.bindings]]
name = "NEWSLETTER_RATE_LIMITER"
type = "ratelimit"
namespace_id = "1002"
simple = { limit = 5, period = 60 }

# Newsletter subscriber list — ISOLATED in D1, deliberately separate from the Firestore family-health
# data (a Worker-secret leak can reach only this email list, never a baby log). Kept COMMENTED until
# the database exists, so a deploy can never fail on a missing id. To activate (see PAID-TEST notes):
#   1) npx wrangler d1 create cubby-newsletter            (or CF dashboard > Workers & Pages > D1)
#   2) npx wrangler d1 execute cubby-newsletter --remote --file=./schema/newsletter.sql
#   3) paste the database_id below, uncomment this block, then deploy (git push).
[[d1_databases]]
binding = "NEWSLETTER_DB"
database_name = "cubby-newsletter"
database_id = "d0ee7337-8acf-4028-80bb-2e99a48db694"

# POST /api/step, the anonymous funnel counter. A person walking the setup wizard sends five at most;
# thirty a minute is generous for a human and tight for a loop trying to fake a funnel.
[[unsafe.bindings]]
name = "STEP_RATE_LIMITER"
type = "ratelimit"
namespace_id = "1004"
simple = { limit = 30, period = 60 }

# Per-IP rate limiter for the guessing-game guest writes (worker.js gameRoute). 20/60s/IP so a whole
# family on one wifi can all guess, but a script can't flood. Falls back to SIGNIN_RATE_LIMITER if absent.
[[unsafe.bindings]]
name = "GAMES_RATE_LIMITER"
type = "ratelimit"
namespace_id = "1003"
simple = { limit = 20, period = 60 }

# POST /api/usage, per signed-in person (or per IP before sign-in). A visit sends a few batches a minute
# at most; 120 a minute stops a loop without ever touching a real person.
[[unsafe.bindings]]
name = "USAGE_RATE_LIMITER"
type = "ratelimit"
namespace_id = "1007"
simple = { limit = 120, period = 60 }

# cubby-usage, written only by this Worker. COMMENTED until the founder creates it (spec §16 step 12):
#   1) npx wrangler d1 create cubby-usage
#   2) npx wrangler d1 execute cubby-usage --remote --file=./schema/usage.sql
#   3) paste the database_id below and in workers/admin/wrangler.toml, uncomment both, then push.
# Unbound, /api/usage answers {"mode":"off"} and stores nothing, whatever USAGE_MODE says.
# [[d1_databases]]
# binding = "USAGE_DB"
# database_name = "cubby-usage"
# database_id = "<paste>"

# POST /api/dose, the "Log it" button on a medicine reminder (worker.js). A tap is one request; ten a
# minute per IP covers a family on one wifi clearing a few reminders, and stops a loop replaying
# tickets. Falls back to SIGNIN_RATE_LIMITER (distinct 'dose:' key prefix) if absent.
[[unsafe.bindings]]
name = "DOSE_RATE_LIMITER"
type = "ratelimit"
namespace_id = "1005"
simple = { limit = 10, period = 60 }

# The 404 counter (worker.js recordPageView). Every unmatched GET reaches it with no account, so it is
# throttled per IP (per /48 on IPv6) before it may write a row to D1. Thirty a minute is far more broken
# links than a person hits. Like every limit here it is approximate (see the note above), so a loop is
# slowed, not capped at thirty; the day ceiling below is the hard bound. No binding means no counting.
# Many addresses still add up, so there is also a hard ceiling per UTC day: PAGE_STATS_DAILY_CAP
# (default 5000 in worker.js; add it under [vars] to change it).
[[unsafe.bindings]]
name = "PAGE_RATE_LIMITER"
type = "ratelimit"
namespace_id = "1006"
simple = { limit = 30, period = 60 }

# Guessing-game store — ISOLATED in its own D1 (cubby-games), never the family Firestore. Holds only
# the host's public title + {nickname, guess, note}. COMMENTED until the DB exists (an uncommented
# missing id fails the deploy). The in-circle game works without it; the public /g/<code> link
# activates once this is provisioned. To activate:
#   1) npx wrangler d1 create cubby-games
#   2) npx wrangler d1 execute cubby-games --remote --file=./schema/games.sql
#   3) paste the database_id below, uncomment this block, then deploy (git push).
[[d1_databases]]
binding = "GAMES_DB"
database_name = "cubby-games"
database_id = "c2e576e9-ad79-416a-a1b9-4598be4f3c82"

# The admin's own database (cubby-admin), written ONLY by the admin Worker (workers/admin). The main Worker
# reads it in exactly one named function, adminChainSummary in worker.js: two SELECTs, so the Monday digest
# carries the access log's chain head and the week's counts (admin spec S19). Kept COMMENTED until the
# database exists (docs/ADMIN-DEPLOY.md step 5): paste the same database_id the admin's wrangler.toml got,
# uncomment, then deploy. Unbound, the digest simply leaves the section out.
# [[d1_databases]]
# binding = "ADMIN_DB"
# database_name = "cubby-admin"
# database_id = "<the cubby-admin id>"
