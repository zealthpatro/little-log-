<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Family games · Cubby</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#FBF3E9">
<link rel="icon" type="image/png" href="/icons/favicon.png">
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  :root{--bg:#FBF3E9;--ink:#2C2521;--soft:#6B5D50;--faint:#9a8d80;--card:#fff;--line:#ECE0D2;--girl:#C97FA0;--boy:#6E97C7;}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:radial-gradient(120% 80% at 50% 0%,#fdefe4,#FBF3E9 60%);color:var(--ink);min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px 18px;touch-action:manipulation;}
  .card{width:100%;max-width:420px;background:var(--card);border:1px solid var(--line);border-radius:26px;box-shadow:0 24px 60px rgba(60,40,25,.14);padding:26px 22px;text-align:center;}
  .brand{font-size:13px;font-weight:800;color:var(--faint);letter-spacing:.04em;margin-bottom:14px;}
  .brand span{color:var(--girl);}
  h1{font-size:24px;font-weight:800;line-height:1.2;margin-bottom:6px;}
  .sub{font-size:14px;color:var(--soft);font-weight:600;margin-bottom:20px;line-height:1.5;}
  input{width:100%;border:2px solid var(--line);background:#FBF7EF;border-radius:14px;padding:13px 15px;font-size:16px;font-weight:600;color:var(--ink);font-family:inherit;margin-bottom:12px;text-align:center;}
  input:focus{outline:none;border-color:var(--girl);}
  .picks{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:6px;}
  .pick{border:2px solid var(--line);background:#FBF7EF;border-radius:18px;padding:20px 10px;font-size:17px;font-weight:800;cursor:pointer;color:var(--ink);font-family:inherit;transition:transform .12s;}
  .pick:active{transform:scale(.96);}
  .pick:disabled{opacity:.5;}
  .pick.girl{border-color:var(--girl);} .pick.boy{border-color:var(--boy);}
  .pick .em{font-size:30px;display:block;margin-bottom:6px;}
  .tally{display:flex;gap:12px;margin:18px 0 6px;}
  .tcol{flex:1;background:#FBF7EF;border-radius:16px;padding:14px 8px;}
  .tcol .n{font-size:26px;font-weight:800;}
  .tcol .l{font-size:12px;font-weight:700;color:var(--soft);margin-top:2px;}
  .tcol.girl .n{color:var(--girl);} .tcol.boy .n{color:var(--boy);}
  .burst{font-size:46px;margin:4px 0 10px;}
  .reveal{background:#fdeef5;border-radius:18px;padding:18px 14px;margin-bottom:6px;}
  .reveal h2{font-size:22px;font-weight:800;} .reveal p{font-size:14px;color:var(--soft);font-weight:600;margin-top:4px;}
  .mine{background:#FBF7EF;border-radius:14px;padding:12px;font-weight:700;font-size:14px;color:var(--soft);margin-bottom:6px;}
  .gcard{border:1px solid var(--line);border-radius:20px;padding:16px 14px;margin-bottom:14px;background:#fffdfa;}
  .ghd{font-size:16px;font-weight:800;margin-bottom:12px;}
  .ddrow{display:flex;gap:10px;}
  .ddrow .ddsmall{flex:1;}
  .relrow{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px;justify-content:center;}
  .relchip{border:1.5px solid var(--line);background:#FBF7EF;border-radius:14px;padding:6px 12px;font-size:13px;font-weight:700;color:var(--soft);font-family:inherit;cursor:pointer;}
  .relchip.on{border-color:var(--girl);color:var(--ink);}
  .small{font-size:12px;color:var(--faint);font-weight:700;margin-top:8px;}
  .note{font-size:12px;color:var(--faint);font-weight:600;margin-top:14px;line-height:1.5;}
  .foot{margin-top:16px;font-size:12px;font-weight:700;}
  .foot a{color:var(--girl);text-decoration:none;}
</style>
</head>
<body>
<div class="card" id="card">
  <div class="brand">🐻 <span>Cubby</span></div>
  <div id="body"><h1>Loading…</h1></div>
  <button id="gshare" class="pick" style="width:100%;margin:4px 0 10px">🔗 Share this game</button>
  <div class="note">A bit of fun, just guesses. The only sure way is a scan. No account needed, nothing tracked.</div>
  <div class="foot">Made with <a href="/">Cubby</a> · a calm, private baby log</div>
</div>
<script>
(function(){
  var code=(location.pathname.replace(/^\/g\/?/,'').split(/[\/?#]/)[0]||'').toLowerCase();
  var body=document.getElementById('body');
  var gshare=document.getElementById('gshare');
  if(gshare) gshare.onclick=function(){ var url=location.href;
    if(navigator.share){ navigator.share({title:'Cubby family games',text:'Guess boy or girl, and the day baby arrives 🐻',url:url}).catch(function(){}); }
    else if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(url).then(function(){ gshare.textContent='Link copied 🔗'; setTimeout(function(){ gshare.textContent='🔗 Share this game'; },1600); }).catch(function(){}); } };
  var hkey='cubby-h-'+code, gkey='cubby-g-'+code;
  var refresh=null, lastHub=null;
  function enc(s){return encodeURIComponent(s);}
  function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function msg(h,s){ body.innerHTML='<h1>'+h+'</h1>'+(s?'<div class="sub">'+s+'</div>':''); }

  // ---- shared (sex game) helpers, also used by the legacy single-game path ----
  function cel(r){ return r==='F'?{b:'🎀✨',h:"It's a girl!"}:r==='M'?{b:'💙✨',h:"It's a boy!"}:r==='MF'?{b:'💙🎀✨',h:"It's twins, one of each!"}:r==='FF'?{b:'🎀🎀✨',h:"It's twins, two girls!"}:r==='MM'?{b:'💙💙✨',h:"It's twins, two boys!"}:null; }
  function tallyHtml(t){ return '<div class="tally"><div class="tcol girl"><div class="n">'+(t.F||0)+'</div><div class="l">🎀 girl</div></div><div class="tcol boy"><div class="n">'+(t.M||0)+'</div><div class="l">💙 boy</div></div></div>'; }
  function rightLine(r,t){ if(r==='MF') return 'A bit of both, so everyone called it! 🎉'; var tgt=r==='FF'?'F':(r==='MM'?'M':r); var n=(tgt==='F'?t.F:t.M)||0; var tot=(t.F||0)+(t.M||0); return n+' of '+tot+' guessed right.'; }

  // ---- date helpers (due-date pool) ----
  function fmtDate(s){ var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s); if(!m) return s; var mo=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][+m[2]-1]; return mo+' '+(+m[3])+', '+m[1]; }
  function ddStats(o){ var p=[]; if(o.weightG) p.push((o.weightG/1000).toFixed(2).replace(/\.?0+$/,'')+' kg'); if(o.lengthCm) p.push(o.lengthCm+' cm'); if(o.timeOfDay) p.push(esc(o.timeOfDay)); return p.join(' · '); }
  function dayDiff(a,b){ return Math.round(Math.abs((Date.parse(a+'T00:00:00')-Date.parse(b+'T00:00:00'))/86400000)); }

  // ================= HUB MODE (multiple games) =================
  function hubMine(){ try{return JSON.parse(localStorage.getItem(hkey)||'null')||{};}catch(e){return {};} }
  function setHubMine(o){ try{localStorage.setItem(hkey,JSON.stringify(o));}catch(e){} }
  function sexTally(g){ var F=0,M=0; (g.guesses||[]).forEach(function(x){ if(x.guess==='F')F++; else if(x.guess==='M')M++; }); return {F:F,M:M}; }

  function sexCard(g, guessed){
    var t=sexTally(g);
    var head='<div class="gcard"><div class="ghd">'+esc(g.prompt||'Boy or girl?')+'</div>';
    if(g.result){ var c=cel(g.result)||{b:'🎉',h:'Revealed!'};
      return head+'<div class="reveal"><div class="burst">'+c.b+'</div><h2>'+c.h+'</h2><p>'+rightLine(g.result,t)+'</p></div>'+(guessed?'<div class="mine">You guessed '+(guessed==='F'?'a girl 🎀':'a boy 💙')+'</div>':'')+tallyHtml(t)+'</div>';
    }
    if(guessed){ return head+'<div class="mine">You guessed <b>'+(guessed==='F'?'a girl 🎀':'a boy 💙')+'</b> 🤍 waiting for the reveal…</div>'+tallyHtml(t)+'</div>'; }
    return head+'<div class="picks" data-sex="'+g.id+'"><button class="pick girl" data-g="F"><span class="em">🎀</span>Girl</button><button class="pick boy" data-g="M"><span class="em">💙</span>Boy</button></div>'+tallyHtml(t)+'</div>';
  }

  function ddCard(g, guessed){
    var head='<div class="gcard"><div class="ghd">'+esc(g.prompt||'When will baby arrive?')+'</div>';
    if(g.result){ var res=null; try{res=JSON.parse(g.result);}catch(e){}
      if(res&&res.date){
        var bestd=1e9, winners=[];
        (g.guesses||[]).forEach(function(x){ var o=null; try{o=JSON.parse(x.guess);}catch(e){} if(o&&o.date){ var d=dayDiff(o.date,res.date); if(d<bestd){bestd=d;winners=[x.nickname];} else if(d===bestd){winners.push(x.nickname);} } });
        var st=ddStats(res), win = winners.length? '<p>Closest: <b>'+winners.map(esc).join(', ')+'</b>'+(bestd===0?' nailed the day! 🎯':' ('+bestd+' day'+(bestd===1?'':'s')+' off)')+'</p>':'';
        return head+'<div class="reveal"><div class="burst">🎉👶</div><h2>Born '+fmtDate(res.date)+'</h2>'+(st?'<p>'+st+'</p>':'')+win+'</div>'+(guessed?'<div class="mine">Your guess: '+fmtDate(guessed.date)+'</div>':'')+'<div class="small">'+(g.count||0)+' guesses</div></div>';
      }
    }
    if(guessed){ var gs=ddStats(guessed); return head+'<div class="mine">Your guess: <b>'+fmtDate(guessed.date)+'</b>'+(gs?' · '+gs:'')+' 🤍 waiting for the big day…</div><div class="small">'+(g.count||0)+' guesses</div></div>'; }
    return head
      +'<input type="date" data-dd-date="'+g.id+'" autocomplete="off">'
      +'<div class="ddrow"><input type="number" inputmode="decimal" class="ddsmall" data-dd-w="'+g.id+'" placeholder="kg (opt)" step="0.01" min="0" max="8"><input type="number" inputmode="numeric" class="ddsmall" data-dd-l="'+g.id+'" placeholder="cm (opt)" min="0" max="80"></div>'
      +'<button class="pick" data-dd-go="'+g.id+'" style="width:100%;margin-top:4px">Add my guess</button>'
      +'<div class="small">'+(g.count||0)+' guesses so far</div></div>';
  }

  function renderHub(st){
    lastHub=st;
    var mine=hubMine(), nick=mine.nickname||'';
    var h='<h1 style="margin-bottom:4px">'+esc(st.title||'Our baby')+'</h1>';
    if(!nick){
      var RELS=['Nana','Grandpa','Auntie','Uncle','Cousin','Friend'];
      h+='<div class="sub">Join the family games. Add your name to play.</div>'
        +'<input id="hnick" placeholder="Your name" maxlength="30" autocomplete="off">'
        +'<div class="relrow">'+RELS.map(function(r){return '<button type="button" class="relchip" data-r="'+r+'">'+r+'</button>';}).join('')+'</div>'
        +'<input id="hrel" placeholder="How are you related? (optional)" maxlength="24" autocomplete="off">'
        +'<button class="pick" id="hjoin" style="width:100%">Let’s play</button>';
      body.innerHTML=h;
      [].forEach.call(document.querySelectorAll('.relchip'),function(b){ b.onclick=function(){ document.getElementById('hrel').value=b.getAttribute('data-r'); [].forEach.call(document.querySelectorAll('.relchip'),function(x){x.classList.remove('on');}); b.classList.add('on'); }; });
      document.getElementById('hjoin').onclick=function(){ var v=(document.getElementById('hnick').value||'').trim(); if(!v){ document.getElementById('hnick').focus(); return; } var rel=(document.getElementById('hrel').value||'').trim(); var m=hubMine(); m.nickname=v; if(rel) m.relation=rel; setHubMine(m); renderHub(st); };
      return;
    }
    h+='<div class="sub" style="margin-bottom:16px">Hi '+esc(nick)+' 👋 add your guesses below.</div>';
    (st.games||[]).forEach(function(g){ var gd=mine.guesses&&mine.guesses[g.id]; h += g.type==='duedate'? ddCard(g,gd) : sexCard(g,gd); });
    body.innerHTML=h;
    wireHub();
  }

  function wireHub(){
    [].forEach.call(document.querySelectorAll('[data-sex]'),function(wrap){ var gid=wrap.getAttribute('data-sex');
      [].forEach.call(wrap.querySelectorAll('.pick'),function(btn){ btn.onclick=function(){ submitHub(gid,btn.getAttribute('data-g')); }; }); });
    [].forEach.call(document.querySelectorAll('[data-dd-go]'),function(btn){ var gid=btn.getAttribute('data-dd-go');
      btn.onclick=function(){
        var di=document.querySelector('[data-dd-date="'+gid+'"]'), dt=di?di.value:'';
        if(!dt){ if(di){di.style.borderColor='var(--girl)';di.focus();} return; }
        var kg=parseFloat(document.querySelector('[data-dd-w="'+gid+'"]').value);
        var cm=parseFloat(document.querySelector('[data-dd-l="'+gid+'"]').value);
        var guess={date:dt}; if(isFinite(kg)&&kg>0) guess.weightG=Math.round(kg*1000); if(isFinite(cm)&&cm>0) guess.lengthCm=Math.round(cm);
        submitHub(gid,guess);
      }; });
  }

  function flash(t){ var f=document.createElement('div'); f.className='mine'; f.style.background='#fdeef5'; f.textContent=t; if(body.firstChild) body.insertBefore(f, body.firstChild.nextSibling); else body.appendChild(f); setTimeout(function(){ if(f.parentNode) f.parentNode.removeChild(f); }, 4000); }
  function submitHub(gameId, guess){
    var mine=hubMine(), nick=mine.nickname||'';
    if(!nick){ if(lastHub) renderHub(lastHub); return; }
    [].forEach.call(document.querySelectorAll('button.pick'),function(b){b.disabled=true;});
    fetch('/api/hub/'+enc(code)+'/guess',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({gameId:gameId,nickname:nick,guess:guess,relation:mine.relation||''})})
      .then(function(r){return r.json().then(function(d){return {ok:r.ok,d:d};});})
      .then(function(x){
        if(!x.ok){
          if(x.d&&x.d.error==='closed'){ flash('The reveal already happened 🤍'); loadHub(); return; } // re-fetch to show the result
          var msgs={full:'This pool is full 🤍',rate_limited:'One moment, then try again 🤍',bad_input:'That guess did not go through, try again.'};
          if(lastHub) renderHub(lastHub); flash((x.d&&msgs[x.d.error])||'Could not save, please try again.'); return;
        }
        var m=hubMine(); m.guesses=m.guesses||{}; m.guesses[gameId]=guess; setHubMine(m); renderHub(x.d);
      })
      .catch(function(){ if(lastHub) renderHub(lastHub); flash('Offline? We could not save your guess.'); });
  }

  // Pause auto-refresh only while a guest is mid-entry (an input focused, or a date typed but unsubmitted),
  // so a re-render never wipes in-progress typing. Reveals still reach guests who played only some games.
  function pollPaused(){
    var a=document.activeElement; if(a&&a.closest&&a.closest('.gcard')) return true;
    var typed=false; [].forEach.call(document.querySelectorAll('[data-dd-date]'),function(i){ if(i.value) typed=true; }); return typed;
  }

  function loadHub(){ apiGet('/api/hub/'+enc(code), function(x){ if(x.ok){ refresh=loadHub; renderHub(x.d); return true; } return false; }, function(x){
      if(x&&x.d&&x.d.error==='server_config'){ msg('Almost ready','This game space is not switched on yet. Check back soon 🤍'); return; }
      loadLegacy(); // not a hub -> maybe a legacy single game
  }); }

  // ================= LEGACY MODE (single boy-or-girl game) =================
  function legacyMine(){ try{return JSON.parse(localStorage.getItem(gkey)||'null');}catch(e){return null;} }
  function renderLegacy(st){
    var t=st.tally||{F:0,M:0}, m=legacyMine();
    if(st.result){ var c=cel(st.result)||{b:'🎉',h:'Revealed!'};
      body.innerHTML='<div class="brand" style="margin-bottom:8px">'+esc(st.title||'Our baby')+'</div><div class="reveal"><div class="burst">'+c.b+'</div><h2>'+c.h+'</h2><p>'+rightLine(st.result,t)+'</p></div>'+(m?'<div class="mine">You guessed '+(m.guess==='F'?'a girl 🎀':'a boy 💙')+'</div>':'')+tallyHtml(t);
      return; }
    if(m){ body.innerHTML='<h1>'+esc(st.title||'Our baby')+'</h1><div class="sub">Boy or girl?</div><div class="mine">You guessed <b>'+(m.guess==='F'?'a girl 🎀':'a boy 💙')+'</b> 🤍 waiting for the reveal…</div>'+tallyHtml(t); return; }
    body.innerHTML='<h1>'+esc(st.title||'Our baby')+'</h1><div class="sub">Boy or girl? Add your guess.</div>'
      +'<input id="nick" placeholder="Your name" maxlength="30" autocomplete="off">'
      +'<input id="why" placeholder="Why? (optional, just for fun)" maxlength="80" autocomplete="off">'
      +'<div class="picks"><button class="pick girl" data-g="F"><span class="em">🎀</span>Girl</button><button class="pick boy" data-g="M"><span class="em">💙</span>Boy</button></div>'
      +tallyHtml(t);
    [].forEach.call(document.querySelectorAll('.pick'),function(btn){ btn.onclick=function(){ submitLegacy(btn.getAttribute('data-g')); }; });
  }
  function submitLegacy(g){
    var nick=(document.getElementById('nick').value||'').trim();
    var why=(document.getElementById('why')?document.getElementById('why').value:'').trim();
    if(!nick){ var n=document.getElementById('nick'); n.style.borderColor='var(--girl)'; n.focus(); return; }
    [].forEach.call(document.querySelectorAll('.pick'),function(b){b.disabled=true;});
    fetch('/api/game/'+enc(code)+'/guess',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({nickname:nick,guess:g,note:why})})
      .then(function(r){return r.json().then(function(d){return {ok:r.ok,d:d};});})
      .then(function(x){ if(!x.ok){ msg('Could not save','Please try again in a moment.'); return; } try{localStorage.setItem(gkey,JSON.stringify({nickname:nick,guess:g}));}catch(e){} renderLegacy(x.d); })
      .catch(function(){ msg('Offline?','We could not save your guess. Try again.'); });
  }
  function loadLegacy(){ apiGet('/api/game/'+enc(code), function(x){ if(x.ok){ refresh=loadLegacy; renderLegacy(x.d); return true; } return false; }, function(x){
      if(x&&x.d&&x.d.error==='server_config'){ msg('Almost ready','This guessing game is not switched on yet. Check back soon 🤍'); }
      else { msg('Game not found','This guessing game may have ended, or the link is off by a letter.'); }
  }); }

  // ---- shared fetch: cb(resultObj) on success (return true if handled), onFail(resultObj) otherwise ----
  function apiGet(path, cb, onFail){
    fetch(path).then(function(r){return r.json().then(function(d){return {ok:r.ok,d:d};},function(){return {ok:r.ok,d:null};});})
      .then(function(x){ if(!cb(x) && onFail) onFail(x); })
      .catch(function(){ msg('Offline?','We could not reach the game. Check your connection and try again.'); });
  }

  function start(){ if(!code){ msg('Hmm','That link looks incomplete.'); return; } loadHub(); }
  window.guestGame={renderHub:renderHub,renderLegacy:renderLegacy}; // QA/debug hook
  start();
  setInterval(function(){
    if(refresh===loadHub){ var m=hubMine(); if(m.nickname && lastHub && !pollPaused()) loadHub(); }
    else if(refresh===loadLegacy){ if(legacyMine()||document.querySelector('.reveal')) loadLegacy(); }
  }, 20000);
})();
</script>
</body>
</html>
