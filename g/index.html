<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Boy or girl? · Cubby</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#FBF3E9">
<link rel="icon" type="image/png" href="/icons/favicon.png">
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  :root{--bg:#FBF3E9;--ink:#2C2521;--soft:#6B5D50;--faint:#9a8d80;--card:#fff;--line:#ECE0D2;--girl:#C97FA0;--boy:#6E97C7;}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:radial-gradient(120% 80% at 50% 0%,#fdefe4,#FBF3E9 60%);color:var(--ink);min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px 18px;touch-action:manipulation;}
  .card{width:100%;max-width:420px;background:var(--card);border:1px solid var(--line);border-radius:26px;box-shadow:0 24px 60px rgba(60,40,25,.14);padding:26px 22px;text-align:center;}
  .brand{font-size:13px;font-weight:800;color:var(--faint);letter-spacing:.04em;margin-bottom:14px;}
  .brand span{color:var(--girl);}
  h1{font-size:24px;font-weight:800;line-height:1.2;margin-bottom:6px;}
  .sub{font-size:14px;color:var(--soft);font-weight:600;margin-bottom:20px;line-height:1.5;}
  input{width:100%;border:2px solid var(--line);background:#FBF7EF;border-radius:14px;padding:13px 15px;font-size:16px;font-weight:600;color:var(--ink);font-family:inherit;margin-bottom:12px;text-align:center;}
  input:focus{outline:none;border-color:var(--girl);}
  .picks{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:6px;}
  .pick{border:2px solid var(--line);background:#FBF7EF;border-radius:18px;padding:20px 10px;font-size:17px;font-weight:800;cursor:pointer;color:var(--ink);font-family:inherit;transition:transform .12s;}
  .pick:active{transform:scale(.96);}
  .pick.girl{border-color:var(--girl);} .pick.boy{border-color:var(--boy);}
  .pick .em{font-size:30px;display:block;margin-bottom:6px;}
  .tally{display:flex;gap:12px;margin:18px 0 6px;}
  .tcol{flex:1;background:#FBF7EF;border-radius:16px;padding:14px 8px;}
  .tcol .n{font-size:26px;font-weight:800;}
  .tcol .l{font-size:12px;font-weight:700;color:var(--soft);margin-top:2px;}
  .tcol.girl .n{color:var(--girl);} .tcol.boy .n{color:var(--boy);}
  .burst{font-size:46px;margin:4px 0 10px;}
  .reveal{background:#fdeef5;border-radius:18px;padding:18px 14px;margin-bottom:14px;}
  .reveal h2{font-size:22px;font-weight:800;} .reveal p{font-size:14px;color:var(--soft);font-weight:600;margin-top:4px;}
  .mine{background:#FBF7EF;border-radius:14px;padding:12px;font-weight:700;font-size:14px;color:var(--soft);margin-bottom:6px;}
  .note{font-size:12px;color:var(--faint);font-weight:600;margin-top:14px;line-height:1.5;}
  .foot{margin-top:16px;font-size:12px;font-weight:700;}
  .foot a{color:var(--girl);text-decoration:none;}
  .hide{display:none;}
</style>
</head>
<body>
<div class="card" id="card">
  <div class="brand">🐻 <span>Cubby</span></div>
  <div id="body"><h1>Loading…</h1></div>
  <div class="note">A bit of fun, just guesses. The only sure way is a scan. No account needed, nothing tracked.</div>
  <div class="foot">Made with <a href="/">Cubby</a> · a calm, private baby log</div>
</div>
<script>
(function(){
  var code=(location.pathname.replace(/^\/g\/?/,'').split(/[\/?#]/)[0]||'').toLowerCase();
  var body=document.getElementById('body');
  var key='cubby-g-'+code;
  function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function mine(){ try{return JSON.parse(localStorage.getItem(key)||'null');}catch(e){return null;} }
  function cel(r){ return r==='F'?{b:'🎀✨',h:"It's a girl!"}:r==='M'?{b:'💙✨',h:"It's a boy!"}:r==='MF'?{b:'💙🎀✨',h:"It's twins, one of each!"}:r==='FF'?{b:'🎀🎀✨',h:"It's twins, two girls!"}:r==='MM'?{b:'💙💙✨',h:"It's twins, two boys!"}:null; }
  function tallyHtml(t){ return '<div class="tally"><div class="tcol girl"><div class="n">'+(t.F||0)+'</div><div class="l">🎀 girl</div></div><div class="tcol boy"><div class="n">'+(t.M||0)+'</div><div class="l">💙 boy</div></div></div>'; }
  function rightLine(r,t){ if(r==='MF') return 'A bit of both, so everyone called it! 🎉'; var tgt=r==='FF'?'F':(r==='MM'?'M':r); var n=(tgt==='F'?t.F:t.M)||0; var tot=(t.F||0)+(t.M||0); return n+' of '+tot+' guessed right.'; }
  function render(st){
    var t=st.tally||{F:0,M:0}, m=mine();
    if(st.result){ var c=cel(st.result)||{b:'🎉',h:'Revealed!'};
      body.innerHTML='<div class="brand" style="margin-bottom:8px">'+esc(st.title||'Our baby')+'</div><div class="reveal"><div class="burst">'+c.b+'</div><h2>'+c.h+'</h2><p>'+rightLine(st.result,t)+'</p></div>'+(m?'<div class="mine">You guessed '+(m.guess==='F'?'a girl 🎀':'a boy 💙')+'</div>':'')+tallyHtml(t);
      return;
    }
    if(m){ body.innerHTML='<h1>'+esc(st.title||'Our baby')+'</h1><div class="sub">Boy or girl?</div><div class="mine">You guessed <b>'+(m.guess==='F'?'a girl 🎀':'a boy 💙')+'</b> 🤍 waiting for the reveal…</div>'+tallyHtml(t); return; }
    body.innerHTML='<h1>'+esc(st.title||'Our baby')+'</h1><div class="sub">Boy or girl? Add your guess.</div>'
      +'<input id="nick" placeholder="Your name" maxlength="30" autocomplete="off">'
      +'<input id="why" placeholder="Why? (optional, just for fun)" maxlength="80" autocomplete="off">'
      +'<div class="picks"><button class="pick girl" data-g="F"><span class="em">🎀</span>Girl</button><button class="pick boy" data-g="M"><span class="em">💙</span>Boy</button></div>'
      +tallyHtml(t);
    [].forEach.call(document.querySelectorAll('.pick'),function(btn){ btn.onclick=function(){ submit(btn.getAttribute('data-g')); }; });
  }
  function msg(h,s){ body.innerHTML='<h1>'+h+'</h1>'+(s?'<div class="sub">'+s+'</div>':''); }
  function load(){
    if(!code){ msg('Hmm','That link looks incomplete.'); return; }
    fetch('/api/game/'+encodeURIComponent(code)).then(function(r){return r.json().then(function(d){return {ok:r.ok,d:d};});})
      .then(function(x){ if(!x.ok){ if(x.d&&x.d.error==='server_config'){ msg('Almost ready','This guessing game is not switched on yet. Check back soon 🤍'); } else { msg('Game not found','This guessing game may have ended, or the link is off by a letter.'); } return; } render(x.d); })
      .catch(function(){ msg('Offline?','We could not reach the game. Check your connection and try again.'); });
  }
  function submit(g){
    var nick=(document.getElementById('nick').value||'').trim();
    var why=(document.getElementById('why')?document.getElementById('why').value:'').trim();
    if(!nick){ var n=document.getElementById('nick'); n.style.borderColor='var(--girl)'; n.focus(); return; }
    [].forEach.call(document.querySelectorAll('.pick'),function(b){b.disabled=true;});
    fetch('/api/game/'+encodeURIComponent(code)+'/guess',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({nickname:nick,guess:g,note:why})})
      .then(function(r){return r.json().then(function(d){return {ok:r.ok,d:d};});})
      .then(function(x){ if(!x.ok){ msg('Could not save','Please try again in a moment.'); return; } try{localStorage.setItem(key,JSON.stringify({nickname:nick,guess:g}));}catch(e){} render(x.d); })
      .catch(function(){ msg('Offline?','We could not save your guess. Try again.'); });
  }
  window.guestGame={render:render}; // QA/debug hook (read-only render of a given state)
  load();
  setInterval(function(){ var m=mine(); if(m||document.querySelector('.reveal')) load(); }, 20000); // refresh tally/reveal once you have guessed
})();
</script>
</body>
</html>
