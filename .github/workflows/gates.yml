name: Gates

# This repo had 24 gates and 2 of them ran anywhere automatically, so the other 22 rotted
# quietly: the FAB gate had been failing for as long as nobody ran it, against a sessionStorage
# key the app renamed underneath it, and nothing said so.
#
# The Chrome-free subset runs here on every push and PR. The browser gates (perf, home-truth,
# report-truth, offline, pad, type, and the rest) need a real Chrome and a local server, so they
# run on the founder's machine via the pre-push hook that tools/install_hooks.sh installs:
#
#   node tools/gates.js               everything judged from the checkout
#   node tools/gates.js --live        also audit what is actually deployed
#   node tools/gates.js --emulator    also the Firestore rules suites

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      # A fresh checkout has no core.hooksPath, so hooks_check would fail on the empty .git/hooks. This
      # is the same step a new clone must do; running it here makes CI the proof of the clone case
      # instead of a run that skips it. It went red for exactly this reason on 2026-09-06.
      - name: Wire the tracked hooks (what a fresh clone must do)
        run: sh tools/install_hooks.sh
      - name: Gates (no browser)
        run: node tools/gates.js --no-browser

  # Production is a separate job on purpose, and it BLOCKS.
  #
  # It used to be continue-on-error, and that was right at the time: the only way it could fail was
  # a Cloudflare dashboard toggle that no code in this repo could reach, so failing the build would
  # have meant a permanently red main nobody could fix by committing.
  #
  # That changed when _headers gained a script-src. The beacon is now refused by the browser
  # whatever the dashboard says, and tools/thirdparty_gate.js passes against live. So from here a
  # failure means a real regression somebody CAN cause by committing, most obviously by dropping
  # that directive. Twelve surfaces promise no third-party trackers, privacy/index.html among them,
  # and the App Store privacy label is signed under penalty. That is worth a red build.
  live:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # tools/node_modules is gitignored, so a fresh runner has no puppeteer-core and this job
      # failed on MODULE_NOT_FOUND every run, never once reaching the assertion it exists to make.
      # A blocking job that cannot pass is worse than no job: it trains everyone to ignore red.
      - name: Install the gate's dependencies
        run: npm install --no-save --prefix tools puppeteer-core
      - name: Third-party trackers on live surfaces
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: node tools/thirdparty_gate.js
      # Runs immediately after the tracker gate ON PURPOSE. The script-src that made that gate green
      # is the same one that locked every user out of their account for five days, because it also
      # refused Firebase Auth's apis.google.com. These two constrain each other, so they belong in
      # the same job: tighten the policy and this fails the moment sign-in stops working.
      - name: Sign-in actually works on live
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: node tools/signin_gate.js https://little-cubby.com
