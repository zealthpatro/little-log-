name: Gates

# This repo had 24 gates and 2 of them ran anywhere automatically, so the other 22 rotted
# quietly: the FAB gate had been failing for as long as nobody ran it, against a sessionStorage
# key the app renamed underneath it, and nothing said so.
#
# The Chrome-free subset and the emulator tier run here on every PR: they are required checks, and
# main takes merges only through a PR whose required checks passed with strict=true (up to date with
# main), so the PR run is a run of the very tree that merges. A push to main runs only `live`: by then
# Cloudflare has deployed it, so re-running gates there gated nothing (38 runner-minutes a merge, until
# 28 Nov 2026). tools/ci_tier_check.js (the ci-tier gate) holds this file, seo.yml and teach.yml to that.
#
# THE SPLIT (test-speed plan items 4-7, 28 Nov 2026). The whole tree tier, browser gates included, runs here
# as 8 shards side by side (`tree`, gates.js --shard=i/8, about 13 min each by tools/gate-times.json), and the
# emulator tier as 4 (`emulator-shard`). `tree-complete` and `emulator-complete` are the checks branch
# protection is to require: each passes only if every leg passed, every shard left its results file, and the
# union of what the shards ran is exactly `gates.js --list` with the same flags, each gate once
# (tools/shard.js --complete). A gate that falls out of every shard turns them red, not green.
# Until protection requires them (the command is in docs/TESTING.md), `gates` and `emulator` below stay as
# they are, required, and the split runs beside them; after the switch those two are removed. Until then the
# browser tier also still runs in the train's full local run (docs/RELEASE-TRAIN.md).
#
#   node tools/gates.js               everything judged from the checkout
#   node tools/gates.js --live        also audit what is actually deployed
#   node tools/gates.js --emulator    also the Firestore rules suites (the `emulator` job below)
#   node tools/gates.js --mutants     every mutation pass. EVERY job here passes it, for now.
#
# MUTATION PASSES STAY ON IN CI (test-speed plan item 14 is held, 28 Nov 2026). Item 14 runs a mutation pass on a
# PR only when the PR touched its inputs (--changed=HEAD^1, tools/mut_select.js), and it is only safe once
# (a) branch protection requires tree-complete and emulator-complete, and (b) plan item 15 traces each pass's
# inputs instead of the hand-declared `mut` lists. Neither holds yet, so turning them off here would leave
# chaos, fuzz-rules, the usage and admin self-tests and usage-d1 with nightly as their only net. ci-tier fails
# this file if any gates.js job (or its -complete check) runs without --mutants; dropping it is an edit to
# tools/ci_tier_check.js's TIER list, made on purpose once (a) and (b) hold.

on:
  push:
    branches: [main]
  pull_request:

# A new push to a PR cancels that PR's older run (15 jobs a run, about 20 the Free plan runs at once). A push to
# main is its own group (its sha), so a deploy's live check is never cancelled by the next merge.
concurrency:
  group: gates-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      # Depth 2: the PR's merge commit and main under it (what --changed=HEAD^1 will read once item 14 is on).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # 3.12, not '3.x': the pinned Pillow and numpy (tools/requirements-brand.txt) ship wheels for it, so CI
      # gets the same compiled image code as the Mac instead of the newest release.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/requirements-brand.txt
      # A fresh checkout has no core.hooksPath, so hooks_check would fail on the empty .git/hooks. This
      # is the same step a new clone must do; running it here makes CI the proof of the clone case
      # instead of a run that skips it. It went red for exactly this reason on 2026-09-06.
      - name: Wire the tracked hooks (what a fresh clone must do)
        run: sh tools/install_hooks.sh
      # tools/brand.py --self-test (Chrome-free, so it runs here) drives the icon generators, which need
      # Pillow and numpy, at the versions the committed icons were made with (an unpinned install took
      # Pillow 12 and brand-py went red on CI from the logo change on, Nov 2026).
      - name: Python image libraries for the brand tools
        run: python3 -m pip install --quiet -r tools/requirements-brand.txt
      # On CI gates.js refuses to start without a ~/Downloads to watch (the guard would be off, unsaid).
      - name: A Downloads folder, so the downloads guard is on
        run: mkdir -p ~/Downloads
      # Every mutation pass, as nightly (item 14 held: see the top of this file).
      - name: Gates (no browser)
        run: node tools/gates.js --no-browser --mutants

  # The whole tree tier in 8 shards (gates.js --shard=i/8: longest first by tools/gate-times.json, the same
  # split on every leg). Linux, so: Chrome named in CHROME_PATH (tools/chrome_path_check.js holds every gate to
  # reading it), puppeteer-core pinned to the version on the founder's Mac, the clock in Dubai as on the Mac
  # the gates were written on, and a ~/Downloads, without which the downloads guard has nothing to watch.
  # fail-fast off: a red leg must not cancel the others before they record what they held.
  tree:
    name: tree (${{ matrix.shard }}/8)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    env:
      TZ: Asia/Dubai
      CHROME_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/requirements-brand.txt
      - name: Wire the tracked hooks (what a fresh clone must do)
        run: sh tools/install_hooks.sh
      - name: Python image libraries for the brand tools
        run: python3 -m pip install --quiet -r tools/requirements-brand.txt
      - name: The browser driver, at the version the Mac runs
        run: npm install --no-save --prefix tools puppeteer-core@25.2.1
      # test/'s own dependencies, as on the Mac and in the emulator jobs. Two tree gates load puppeteer-core from
      # test/ (fab-quicklog, duedate-cycle) and two start their own Firestore emulator through test/'s firebase-tools
      # (preg-tick-race, two-caregivers: tree-tier by design, test/helpers/tree-base.js, so every push runs them).
      # Without these steps all four failed at the door on PR #16's first run (ENOENT, Cannot find module), never
      # on what they test. Installed with npm ci from test/package-lock.json, the Mac's own tree committed (721
      # packages, each the version installed there), and cached by that lockfile: a cache miss installs exactly
      # those versions, never a newer one in range. The emulator is Java, and its jar is cached beside it.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Cache test/ dependencies
        id: test-deps
        uses: actions/cache@v4
        with:
          path: test/node_modules
          key: test-deps-${{ runner.os }}-node22-${{ hashFiles('test/package-lock.json') }}
      - name: Install firebase-tools, the rules-testing SDK and puppeteer-core (test/package-lock.json)
        if: steps.test-deps.outputs.cache-hit != 'true'
        run: npm ci --prefix test --no-audit --no-fund
      - name: Cache the Firestore emulator jar
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-${{ hashFiles('test/package-lock.json') }}
      - name: A Downloads folder, so the downloads guard is on
        run: mkdir -p ~/Downloads
      - name: Tree gates, one shard of 8
        run: node tools/gates.js --shard=${{ matrix.shard }}/8 --mutants --record-times=${{ runner.temp }}/results/shard-${{ matrix.shard }}-of-8.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tree-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/results/
          if-no-files-found: ignore
          retention-days: 7

  # The required tree check. always(): when a leg fails, a plain dependant is SKIPPED, and branch protection
  # counts a skipped check as passed. The results go to runner.temp, outside the checkout, so they are not an
  # untracked change that could move the mutation plan --list computes.
  tree-complete:
    runs-on: ubuntu-latest
    if: always() && github.event_name == 'pull_request'
    needs: tree
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          pattern: tree-shard-*
          merge-multiple: true
          path: ${{ runner.temp }}/results
      - name: Every shard ran and passed, and each gate ran in exactly one
        run: node tools/shard.js --complete=${{ runner.temp }}/results --of=8 --legs=${{ needs.tree.result }} -- --mutants

  # THE SECOND NET for the Firestore emulator tier (Nov 2026). The rules suites, the Worker-against-
  # Firestore suites and the chaos/fuzz self-tests ran on nothing automatic: the founder's pre-push
  # hook used to run them when a push touched the rules, the Worker or the Firestore layer. This job runs
  # them on every PR (a required check), so nothing merges unjudged; a push to main skips it (above).
  #
  # tools/gates.js --emulator-only gives each suite its own free ports (never the 8080 default) and
  # uses test/node_modules' own firebase-tools, which `npm ci --prefix test` puts there. The
  # self-hosting suites drive the app in Chrome, so this runner's Chrome is named in CHROME_PATH and
  # puppeteer-core is installed next to the gates, exactly as the live job does.
  emulator:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    # Measured on the founder's Mac (16 Nov 2026): the 34 suites of --emulator-only (ops-admin, 7.5 s, included)
    # sum to about 37.6 min at their slowest runs across every log of that day (usage-tracker-emu 645 s, chaos
    # 327 s, usage-d1 195 s, invite-family 185 s, blob-sync 139 s), before the installs. Not yet timed on this
    # runner. Raise this when a run here passes 45 minutes.
    timeout-minutes: 60
    steps:
      # Full history: test/links-leave.test.js grades old app builds against the rules published BEFORE
      # (git show 866851ac:firestore.rules). A depth-1 checkout has no such commit, so that half went red
      # on every CI run while it passed on the laptop.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # The Firestore and Auth emulators are Java; 21 is what current firebase-tools asks for.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install firebase-tools and the rules-testing SDK (test/package-lock.json)
        run: npm ci --prefix test --no-audit --no-fund
      # puppeteer-core AND firebase-admin in ONE install: `npm install --no-save X` prunes every package X
      # does not depend on, and the invite suites load firebase-admin from tools/node_modules (adminFrom).
      # Installing puppeteer-core alone left them failing on "Cannot find module 'firebase-admin/app'".
      # miniflare goes in the same install for the same reason: usage-d1 (test/usage-d1-engine.test.js) runs the
      # usage SQL on workerd's own D1 and looks for it in tools/node_modules. Pinned to the version that test pins
      # (MINIFLARE_PIN in workers/admin/dev/d1-miniflare.mjs, what wrangler 4.162.0 ships); another one fails it.
      - name: Install the browser driver, the admin SDK and the local D1 runtime the self-hosting suites use
        run: npm install --no-save --prefix tools puppeteer-core@25.2.1 firebase-admin miniflare@5.20261113.0-beta
      - name: A Downloads folder, so the downloads guard is on
        run: mkdir -p ~/Downloads
      - name: Firestore emulator tier (each suite on its own free ports)
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: node tools/gates.js --emulator-only --mutants

  # The emulator tier in 4 shards, on 4 machines (one VM each, never suites side by side on one). Measured
  # serially it is about 38 min; split by tools/gate-times.json each shard is about 10-11 min, the floor being
  # usage-tracker-emu alone. Each suite already takes its own free ports. The Firestore jar is fetched up front:
  # usage-tracker-emu starts it from firebase-tools' cache, which `rules` used to fill first, and a shard need
  # not hold `rules`.
  emulator-shard:
    name: emulator (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      CHROME_PATH: /usr/bin/google-chrome
    steps:
      # Full history, as the emulator job: links-leave grades old builds against rules from older commits.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install firebase-tools and the rules-testing SDK (test/package-lock.json)
        run: npm ci --prefix test --no-audit --no-fund
      - name: Install the browser driver, the admin SDK and the local D1 runtime the self-hosting suites use
        run: npm install --no-save --prefix tools puppeteer-core@25.2.1 firebase-admin miniflare@5.20261113.0-beta
      - name: The Firestore emulator jar, before any suite needs it
        run: test/node_modules/.bin/firebase setup:emulators:firestore
      - name: A Downloads folder, so the downloads guard is on
        run: mkdir -p ~/Downloads
      - name: Firestore emulator tier, one shard of 4
        run: node tools/gates.js --emulator-only --shard=${{ matrix.shard }}/4 --mutants --record-times=${{ runner.temp }}/results/shard-${{ matrix.shard }}-of-4.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/results/
          if-no-files-found: ignore
          retention-days: 7

  # The required emulator check, built as tree-complete is (always(), the legs' result, the same flags).
  emulator-complete:
    runs-on: ubuntu-latest
    if: always() && github.event_name == 'pull_request'
    needs: emulator-shard
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          pattern: emulator-shard-*
          merge-multiple: true
          path: ${{ runner.temp }}/results
      - name: Every emulator shard ran and passed, and each suite ran in exactly one
        run: node tools/shard.js --complete=${{ runner.temp }}/results --of=4 --legs=${{ needs.emulator-shard.result }} -- --emulator-only --mutants

  # Production is a separate job on purpose, and it BLOCKS.
  #
  # It used to be continue-on-error, and that was right at the time: the only way it could fail was
  # a Cloudflare dashboard toggle that no code in this repo could reach, so failing the build would
  # have meant a permanently red main nobody could fix by committing.
  #
  # That changed when _headers gained a script-src. The beacon is now refused by the browser
  # whatever the dashboard says, and tools/thirdparty_gate.js passes against live. So from here a
  # failure means a real regression somebody CAN cause by committing, most obviously by dropping
  # that directive. Twelve surfaces promise no third-party trackers, privacy/index.html among them,
  # and the App Store privacy label is signed under penalty. That is worth a red build.
  live:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # tools/node_modules is gitignored, so a fresh runner has no puppeteer-core and this job
      # failed on MODULE_NOT_FOUND every run, never once reaching the assertion it exists to make.
      # A blocking job that cannot pass is worse than no job: it trains everyone to ignore red.
      - name: Install the gate's dependencies
        run: npm install --no-save --prefix tools puppeteer-core@25.2.1
      - name: Third-party trackers on live surfaces
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: node tools/thirdparty_gate.js
      # Runs immediately after the tracker gate ON PURPOSE. The script-src that made that gate green
      # is the same one that locked every user out of their account for five days, because it also
      # refused Firebase Auth's apis.google.com. These two constrain each other, so they belong in
      # the same job: tighten the policy and this fails the moment sign-in stops working.
      - name: Sign-in actually works on live
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: node tools/signin_gate.js https://little-cubby.com
